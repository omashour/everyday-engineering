video:
  id: "009"
  topic: T04
  title: "Why Your Wi-Fi Dies in One Room"
  style: "B hook + C body"
  playlist: math-for-engineers
  phase: math
  series: null
  voice_note: ""
  pronounce: {dBm: dee-bee-EM}

scenes:
  - id: S01
    component: photo-overlay
    chapter: "Why one room is dead"
    say: >-
      Wi-Fi is perfect next to the router and almost dead in one room. In open space, move
      twice as far away and you get a quarter of the signal. But that's only half the story.
      The rest is in your walls.
    params:
      src: wifi-room.jpg
      credit: "Image: AI-generated"
      title: "Why is one room always dead?"
      overlays:
        - {type: callout, pos: [80, 40], text: "almost dead", side: right, cue: "almost dead"}
        - {type: measure, from: [18, 78], to: [80, 78], label: "2× distance → ¼ signal", cue: "twice as far"}
        - {type: label, pos: [22, 30], text: "+ the walls", cue: "in your walls"}

  - id: S02
    component: title-card
    say: Let's follow your signal from the router to that room, with one law of physics and a little algebra.
    params: {kicker: "Everyday Engineering · Algebra", title: "Why Your Wi-Fi Dies in One Room"}

  - id: S03
    component: diagram
    chapter: "Power spreads out"
    say: >-
      Think of your router as a tiny light bulb for radio waves. In open space, it spreads
      its power outward. One meter away, that power is spread over a sphere with a radius of
      one meter. Two meters away, the same power covers a sphere twice as wide. The surface
      area of a sphere is four pi r squared. Double r, and the area grows by two squared,
      four times. Same power, four times the area. So every square meter gets a quarter as
      much.
    params:
      heading: "Same power, bigger sphere"
      view: [1000, 600]
      items:
        - {type: icon, pos: [300, 300], name: router, size: l, cue: "tiny light bulb"}
        - {type: circle, pos: [300, 300], r: 90, color: blue, label: "1 m", cue: "One meter away"}
        - {type: circle, pos: [300, 300], r: 180, color: blue, dashed: true, label: "2 m", cue: "Two meters away"}
        - {type: tex, pos: [760, 180], tex: "A = 4\\pi r^2", size: l, cue: "four pi r squared"}
        - {type: tex, pos: [760, 320], tex: "(2r)^2 = 4r^2", cue: "two squared"}
        - {type: text, pos: [760, 450], text: "¼ per square meter", hand: true, color: red, anchor: middle, cue: "a quarter as much"}

  - id: S04
    component: equation-steps
    chapter: "The inverse square law"
    say: >-
      As an equation, the power landing on each square meter, at distance r, is the power P
      divided by four pi r squared. That's the inverse square law. Now compare two distances.
      At twice the distance, the four pi and the P cancel, and you're left with one over two
      squared. One quarter. Three times as far, one ninth. Ten times as far, one hundredth.
    params:
      heading: "The inverse square law"
      size: l
      lines:
        - {tex: "S = \\dfrac{P}{4\\pi r^2}", mark: true, cue: "divided by four pi"}
        - {tex: "\\dfrac{S(2r)}{S(r)} = \\dfrac{1}{2^2} = \\dfrac{1}{4}", box: true, cue: "one over two squared"}
        - {tex: "3r:\\ \\tfrac{1}{9} \\qquad 10r:\\ \\tfrac{1}{100}", cue: "Three times as far"}

  - id: S05
    component: graph
    chapter: "The curve"
    say: >-
      Here's what that looks like. Start at one meter, and call that signal one hundred
      percent. At two meters, you're down to twenty five percent. At four meters, about six
      percent. The curve drops steeply at first, then flattens out. Most of the loss happens
      in the first few meters from the router.
    params:
      heading: "Signal vs. distance (open space)"
      x_range: [0, 10]
      y_range: [0, 110]
      x_label: "distance from router (m)"
      y_label: "signal (% of 1 m value)"
      functions:
        - {expr: "100/x^2", from: 1, to: 10, label: "$S \\propto 1/r^2$", color: blue, cue: "Here's what"}
      points:
        - {x: 1, y: 100, cue: "one hundred percent"}
        - {x: 2, y: 25, label: "25%", cue: "twenty five percent"}
        - {x: 4, y: 6.25, label: "6%", cue: "about six percent"}
      tracer: {expr: "100/x^2", from: 1, to: 10, cue: "drops steeply", duration: 4}

  - id: S06
    component: equation-steps
    chapter: "In decibels"
    say: >-
      Engineers rarely use percentages for this. They use decibels, because signals cover such
      a huge range. A change in decibels is ten times the log of the power ratio. A quarter
      of the power is ten log of one quarter, about minus six decibels. One hundredth of the
      power is minus twenty. So in decibels, every doubling of distance costs about six
      decibels, and every ten times the distance costs twenty.
    params:
      heading: "Distance in decibels"
      lines:
        - {tex: "\\Delta = 10\\log_{10}\\!\\left(\\tfrac{P_2}{P_1}\\right)\\ \\text{dB}", cue: "ten times the log"}
        - {tex: "10\\log_{10}\\!\\left(\\tfrac{1}{4}\\right) \\approx -6\\ \\text{dB}", cue: "about minus six"}
        - {tex: "10\\log_{10}\\!\\left(\\tfrac{1}{100}\\right) = -20\\ \\text{dB}", cue: "is minus twenty"}
        - {text: "2× distance: **−6 dB** · 10× distance: **−20 dB**", box: true, cue: "every doubling"}

  - id: S07
    component: big-fact
    chapter: "Measuring Wi-Fi in dBm"
    say: >-
      Your phone measures Wi-Fi in dBm, decibels compared to one milliwatt. Zero dBm is one
      milliwatt. Minus thirty is a thousandth of a milliwatt. Minus seventy, a signal you can
      still browse on, is one ten-billionth of a watt. Your phone pulls web pages out of that.
    params:
      value: "0.0000000001 W"
      label: "−70 dBm"
      sub: "still enough to browse"
      cue: "one ten-billionth"

  - id: S08
    component: table
    chapter: "What the numbers mean"
    say: >-
      Here's a rough guide that Wi-Fi engineers use. Around minus thirty, you're right next to
      the router. Down to minus fifty is excellent. Minus sixty seven is about the minimum for
      video calls and streaming. Minus seventy is fine for light browsing and email. By minus
      eighty, the connection becomes unreliable. And at minus ninety, you'll struggle to
      connect at all.
    params:
      heading: "Reading your signal"
      headers: ["Signal", "What it means"]
      rows:
        - ["−30 dBm", "right next to the router"]
        - ["−50 dBm", "excellent"]
        - ["−67 dBm", "minimum for calls, streaming"]
        - ["−70 dBm", "light browsing, email"]
        - ["−80 dBm", "unreliable"]
        - ["−90 dBm", "hard to connect at all"]
      row_cues: ["Around minus thirty", "Down to minus fifty", "Minus sixty seven", "Minus seventy is", "By minus eighty", "at minus ninety"]

  - id: S09
    component: graph
    chapter: "Distance alone"
    say: >-
      Now let's test distance alone. Say your phone reads minus thirty at one meter. Each
      doubling costs six decibels. Two meters, minus thirty six. Eight meters, minus forty
      eight. Thirty two meters, minus sixty. On a decibel scale, the steep curve becomes a
      straight line. And look where it ends. Even thirty two meters away, in open space, you'd
      still have a good signal. With these numbers, distance alone doesn't explain a dead room.
    params:
      heading: "Distance alone (open space)"
      x_range: [0, 5.5]
      y_range: [-70, -20]
      x_label: "doublings of distance from 1 m"
      y_label: "signal (dBm)"
      functions:
        - {expr: "-30-6.02*x", label: "−6 dB per doubling", color: blue, cue: "straight line"}
      points:
        - {x: 1, y: -36, label: "2 m: −36", cue: "thirty six"}
        - {x: 3, y: -48, label: "8 m: −48", cue: "forty eight"}
        - {x: 5, y: -60, label: "32 m: −60", cue: "minus sixty"}
      side:
        - {tex: "\\text{assume } -30\\ \\text{dBm at 1 m}", cue: "minus thirty at one"}

  - id: S10
    component: diagram
    chapter: "Walls cost decibels"
    say: >-
      So what's really happening in that one room? Usually, it's what the signal has to pass
      through. Every wall takes away a chunk of decibels, no matter how far you are. Typical
      values at two point four gigahertz: about four decibels for a drywall wall, about eight
      for brick, and ten to fifteen for concrete. Metal, like a steel door, can take even
      more.
    params:
      heading: "Every wall costs decibels"
      view: [1000, 600]
      items:
        - {type: icon, pos: [90, 300], name: router, size: l}
        - {type: icon, pos: [920, 300], name: device-mobile, size: l}
        - {type: arrow, from: [150, 300], to: [860, 300], color: blue, cue: "pass through"}
        - {type: line, from: [260, 140], to: [260, 440], color: muted, width: 8, cue: "about four decibels"}
        - {type: text, pos: [260, 500], text: "drywall ≈ 4 dB", anchor: middle, cue: "about four decibels"}
        - {type: line, from: [500, 140], to: [500, 440], color: red, width: 14, cue: "eight for brick"}
        - {type: text, pos: [500, 500], text: "brick ≈ 8 dB", anchor: middle, cue: "eight for brick"}
        - {type: line, from: [740, 140], to: [740, 440], color: ink, width: 22, cue: "ten to fifteen"}
        - {type: text, pos: [740, 500], text: "concrete ≈ 10–15 dB", anchor: middle, cue: "ten to fifteen"}
        - {type: text, pos: [500, 90], text: "steel door: even more", hand: true, color: red, anchor: middle, cue: "steel door"}
      caption: "Typical values at 2.4 GHz; real walls vary"

  - id: S11
    component: equation-steps
    chapter: "Adding it up"
    say: >-
      Now the dead room. It's ten meters from the router, and the signal crosses two drywall
      walls and one concrete wall, say twelve decibels. Distance first. Ten meters is ten times
      one meter, so we lose twenty decibels. Minus thirty becomes minus fifty. Now the walls.
      Four, four and twelve. That's twenty more. Minus fifty becomes minus seventy. The walls
      cost as much as the distance did.
    params:
      heading: "The dead room, step by step"
      size: l
      lines:
        - {tex: "-30 - 20 = -50\\ \\text{dBm}", note: "distance", cue: "lose twenty decibels"}
        - {tex: "-50 - 4 - 4 - 12 = -70\\ \\text{dBm}", box: true, note: "walls", cue: "Minus fifty becomes"}
        - {text: "walls **−20 dB** = distance **−20 dB**", circle: true, cue: "cost as much"}

  - id: S12
    component: graph
    chapter: "The signal staircase"
    say: >-
      Here's the same path on a graph. The dashed curve is open space. It only drops to minus
      fifty at ten meters. The solid line follows your real signal. Every time it hits a wall,
      it steps straight down. Drywall at three meters, drywall at six, and concrete at eight.
      By the bedroom, you're at minus seventy, below what video calls need.
    params:
      heading: "Distance plus walls"
      x_range: [0, 10.5]
      y_range: [-80, -20]
      x_label: "distance from router (m)"
      y_label: "signal (dBm)"
      functions:
        - {expr: "-30-20*log10(x)", from: 1, to: 10, label: "open space", color: muted, dashed: true, cue: "dashed curve"}
        - {expr: "-30-20*log10(x)", from: 1, to: 3, color: red, cue: "solid line follows"}
        - {expr: "-34-20*log10(x)", from: 3, to: 6, color: red, cue: "Drywall at three"}
        - {expr: "-38-20*log10(x)", from: 6, to: 8, color: red, cue: "drywall at six"}
        - {expr: "-50-20*log10(x)", from: 8, to: 10, color: red, cue: "concrete at eight"}
      vlines:
        - {x: 3, label: "drywall", cue: "Drywall at three"}
        - {x: 6, label: "drywall", cue: "drywall at six"}
        - {x: 8, label: "concrete", cue: "concrete at eight"}
      points:
        - {x: 10, y: -70, label: "bedroom: −70", cue: "By the bedroom"}
      side:
        - {tex: "\\text{open space at 10 m: } -50", cue: "minus fifty at ten"}

  - id: S13
    component: equation-steps
    chapter: "The fix"
    say: >-
      So what can you do? Move the router toward the middle of the home, and away from that
      concrete wall. Now the bedroom is five meters away, through one drywall wall. Five meters
      costs about fourteen decibels. Minus thirty becomes minus forty four. One wall takes four
      more. Minus forty eight. That's excellent, without buying anything.
    params:
      heading: "Move the router"
      size: l
      lines:
        - {tex: "20\\log_{10}(5) \\approx 14\\ \\text{dB}", cue: "fourteen decibels"}
        - {tex: "-30 - 14 = -44\\ \\text{dBm}", cue: "minus forty four"}
        - {tex: "-44 - 4 = -48\\ \\text{dBm}", box: true, note: "excellent", note_cue: "That's excellent", cue: "Minus forty eight"}

  - id: S14
    component: bullets
    chapter: "Other ways around walls"
    say: >-
      If moving the router isn't possible, the goal is the same: fewer walls between the router
      and you. Keep it up off the floor and out in the open. Keep it away from big metal
      objects. And in a large home, or one with concrete walls, a second access point or a mesh
      system puts a transmitter on the other side of the wall.
    params:
      heading: "Fewer walls in the way"
      items:
        - {text: "Fewer walls in the path", icon: wall, cue: "fewer walls"}
        - {text: "Up high, out in the open", icon: arrow-up, cue: "off the floor"}
        - {text: "Away from metal", icon: magnet, cue: "big metal objects"}
        - {text: "Big home? Add a mesh point", icon: router, cue: "mesh system"}

  - id: S15
    component: table
    chapter: "Same law, everywhere"
    say: >-
      The inverse square law isn't just about Wi-Fi. A lamp, a loudspeaker in an open field, a
      cell tower: anything that spreads out from a small source follows it. Twice the
      distance, a quarter of the power, minus six decibels. Ten times the distance, one
      hundredth, minus twenty. That's why engineers who design lighting, sound systems and
      antennas all start with the same equation.
    params:
      heading: "One law, many engineers"
      headers: ["Source", "2× distance", "10× distance"]
      rows:
        - ["Wi-Fi router", "¼ · −6 dB", "1/100 · −20 dB"]
        - ["Lamp", "¼ as bright", "1/100 as bright"]
        - ["Speaker (open field)", "−6 dB", "−20 dB"]
      row_cues: ["isn't just about", "A lamp", "a loudspeaker"]

  - id: S16
    component: bullets
    chapter: "Remember this"
    say: >-
      So why does your Wi-Fi die in one room? In open space, signal follows the inverse square
      law. Double the distance, a quarter of the power, minus six decibels. But inside a home,
      walls often cost as much as distance, or more. Count the walls, not just the meters. And
      the cheapest fix is often just moving the router.
    params:
      heading: "Remember this"
      items:
        - {text: "$S \\propto 1/r^2$ in open space", icon: math-function, cue: "inverse square"}
        - {text: "2× distance → ¼ power, −6 dB", icon: arrows-horizontal, cue: "Double the distance"}
        - {text: "Count walls, not just meters", icon: wall, cue: "Count the walls"}
        - {text: "Move the router first", icon: router, cue: "moving the router"}

  - id: S17
    component: end-card
    say: If you liked this video, please give it a like and subscribe for more everyday engineering. Thanks for watching!
    params: {line: "Thanks for watching"}
