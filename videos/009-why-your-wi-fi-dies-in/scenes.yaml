video:
  id: "009"
  topic: T04
  title: "Why Your Wi-Fi Dies in One Room"
  style: "B hook + C body"
  playlist: math-for-engineers
  phase: math
  series: null
  voice_note: ""
  pronounce: {dBm: dee-bee-EM}

scenes:
  - id: S01
    component: photo-overlay
    chapter: "Why one room is dead"
    say: >-
      Wi-Fi is perfect next to the router and almost dead in one room. In ideal open space,
      move twice as far and you receive a quarter of the power. But that's only half the
      story. The rest is in your walls.
    params:
      src: wifi-room.jpg
      credit: "Image: AI-generated"
      title: "Why is one room always dead?"
      overlays:
        - {type: callout, pos: [80, 40], text: "almost dead", side: right, cue: "almost dead"}
        - {type: measure, from: [18, 78], to: [80, 78], label: "2× distance → ¼ power", cue: "twice as far"}
        - {type: label, pos: [22, 30], text: "+ the walls", cue: "in your walls"}

  - id: S02
    component: title-card
    say: Let's follow your signal from the router to that room, with one law of physics and a little algebra.
    params: {kicker: "Everyday Engineering · Algebra", title: "Why Your Wi-Fi Dies in One Room"}

  - id: S03
    component: diagram
    chapter: "Power spreads out"
    say: >-
      Think of your router as a tiny light bulb for radio waves. In ideal open space, its power
      spreads outward. One meter away, it covers a sphere one meter in radius. Two meters away,
      the same power covers a sphere twice as wide. A sphere's area is four pi r squared. Double
      r, and the area grows by two squared, four times. So every square meter gets a quarter as
      much.
    params:
      heading: "Same power, bigger sphere"
      view: [1000, 600]
      items:
        - {type: icon, pos: [300, 300], name: router, size: l, cue: "tiny light bulb"}
        - {type: circle, pos: [300, 300], r: 90, color: blue, label: "1 m", cue: "One meter away"}
        - {type: circle, pos: [300, 300], r: 180, color: blue, dashed: true, label: "2 m", cue: "Two meters away"}
        - {type: tex, pos: [760, 180], tex: "A = 4\\pi r^2", size: l, cue: "four pi r squared"}
        - {type: tex, pos: [760, 320], tex: "(2r)^2 = 4r^2", cue: "two squared"}
        - {type: text, pos: [760, 450], text: "¼ per square meter", hand: true, color: red, anchor: middle, cue: "a quarter as much"}

  - id: S04
    component: equation-steps
    chapter: "The inverse square law"
    say: >-
      As an equation, the power passing through each square meter, at distance r, is the power
      P divided by four pi r squared. That's the inverse square law. Your phone's antenna
      catches a share of that, so if the antennas and frequency stay the same, the power your
      phone receives follows the same rule. At twice the distance, you're left with one over
      two squared. One quarter. Three times as far, one ninth. Ten times as far, one hundredth.
    params:
      heading: "The inverse square law"
      lines:
        - {tex: "S = \\dfrac{P}{4\\pi r^2}", mark: true, cue: "divided by four pi"}
        - {text: "received power: same rule (same antennas, frequency)", cue: "power your phone receives"}
        - {tex: "\\dfrac{P_r(2r)}{P_r(r)} = \\dfrac{1}{2^2} = \\dfrac{1}{4}", box: true, cue: "one over two squared"}
        - {tex: "3r:\\ \\tfrac{1}{9} \\qquad 10r:\\ \\tfrac{1}{100}", cue: "Three times as far"}

  - id: S05
    component: graph
    chapter: "The curve"
    say: >-
      Here's what that looks like. Start at one meter, and call the power there one hundred
      percent. At two meters, you're down to twenty five percent. At four meters, about six
      percent. The curve looks like it flattens out, but it never really slows down. Every
      doubling of distance takes away another three quarters of whatever was left.
    params:
      heading: "Received power vs. distance (ideal open space)"
      x_range: [0, 10]
      y_range: [0, 110]
      x_label: "distance from router (m)"
      y_label: "power (% of 1 m value)"
      functions:
        - {expr: "100/x^2", from: 1, to: 10, label: "$P \\propto 1/r^2$", color: blue, cue: "Here's what"}
      points:
        - {x: 1, y: 100, cue: "one hundred percent"}
        - {x: 2, y: 25, label: "25%", cue: "twenty five percent"}
        - {x: 4, y: 6.25, label: "6%", cue: "about six percent"}
      tracer: {expr: "100/x^2", from: 1, to: 10, cue: "flattens out", duration: 4}
      side:
        - {tex: "\\text{each doubling: } \\times\\tfrac{1}{4}", cue: "Every doubling"}

  - id: S06
    component: equation-steps
    chapter: "In decibels"
    say: >-
      Engineers usually use decibels for this, because signals cover such a huge range. A change
      in decibels is ten times the log of the power ratio. A quarter of the power is about minus
      six decibels. One hundredth is minus twenty. So every doubling of distance costs about six
      decibels, and every ten times the distance costs twenty.
    params:
      heading: "Distance in decibels"
      lines:
        - {tex: "\\Delta = 10\\log_{10}\\!\\left(\\tfrac{P_2}{P_1}\\right)\\ \\text{dB}", cue: "ten times the log"}
        - {tex: "10\\log_{10}\\!\\left(\\tfrac{1}{4}\\right) \\approx -6\\ \\text{dB}", cue: "about minus six"}
        - {tex: "10\\log_{10}\\!\\left(\\tfrac{1}{100}\\right) = -20\\ \\text{dB}", cue: "is minus twenty"}
        - {text: "2× distance: **−6 dB** · 10× distance: **−20 dB**", box: true, cue: "every doubling"}

  - id: S07
    component: big-fact
    chapter: "Measuring Wi-Fi in dBm"
    say: >-
      Your phone measures Wi-Fi in dBm, decibels compared to one milliwatt. Minus thirty dBm is a
      thousandth of a milliwatt. Minus seventy is one ten-billionth of a watt, and a phone can
      often still browse on that.
    params:
      value: "0.0000000001 W"
      label: "−70 dBm"
      sub: "often still usable"
      cue: "one ten-billionth"

  - id: S08
    component: table
    chapter: "What the numbers mean"
    say: >-
      Here's a rough guide. Around minus thirty dBm is an extremely strong signal, right next to
      the router. Minus fifty is excellent. Around minus sixty seven is a common design target
      for demanding uses like voice calls. Minus seventy can still support everyday internet
      use. Around minus eighty, connections may become unreliable. And near minus ninety,
      staying connected can be difficult. These aren't hard cutoffs. Interference and crowded
      networks matter too.
    params:
      heading: "A rough guide, not hard cutoffs"
      headers: ["Signal", "Typical meaning"]
      rows:
        - ["≈ −30 dBm", "extremely strong (next to router)"]
        - ["−50 dBm", "excellent"]
        - ["≈ −67 dBm", "common target for voice calls"]
        - ["−70 dBm", "everyday use often fine"]
        - ["≈ −80 dBm", "may become unreliable"]
        - ["≈ −90 dBm", "hard to stay connected"]
      row_cues: ["Around minus thirty", "Minus fifty is", "Around minus sixty", "Minus seventy can", "Around minus eighty", "near minus ninety"]

  - id: S09
    component: graph
    chapter: "Distance alone"
    say: >-
      Now let's test distance alone, in ideal open space. Say your phone reads minus thirty at one
      meter. Every time we double the distance, we lose another six decibels. Two meters, minus
      thirty six. Eight meters, minus forty eight. Thirty two meters, minus sixty. Because we're
      counting distance in doublings, which is a logarithmic scale, the points fall on a straight
      line. Even thirty two meters away, the model still gives a reasonably strong signal. With
      these numbers, distance alone doesn't explain a weak room.
    params:
      heading: "Distance alone (ideal open space)"
      x_range: [0, 5.5]
      y_range: [-70, -20]
      x_label: "doublings of distance from 1 m (log scale)"
      y_label: "signal (dBm)"
      functions:
        - {expr: "-30-6.02*x", label: "−6 dB per doubling", color: blue, cue: "straight"}
      points:
        - {x: 1, y: -36, label: "2 m: −36", cue: "thirty six"}
        - {x: 3, y: -48, label: "8 m: −48", cue: "forty eight"}
        - {x: 5, y: -60, label: "32 m: −60", cue: "minus sixty"}
      side:
        - {tex: "\\text{assume } -30\\ \\text{dBm at 1 m}", cue: "minus thirty at one"}

  - id: S10
    component: diagram
    chapter: "Walls cost decibels"
    say: >-
      So what's happening in that one room? Usually, it's what the signal has to pass through.
      Every wall adds its own loss, measured in decibels. At two point four gigahertz, a drywall
      partition might cost a few decibels. Brick can cost several more. Thick or reinforced
      concrete can cost much more than that. And metal, like a steel door, can block the signal
      especially strongly. The exact amount depends on the material, the thickness and how the
      wall is built.
    params:
      heading: "Every wall costs decibels"
      view: [1000, 600]
      items:
        - {type: icon, pos: [90, 300], name: router, size: l}
        - {type: icon, pos: [920, 300], name: device-mobile, size: l}
        - {type: arrow, from: [150, 300], to: [860, 300], color: blue, cue: "pass through"}
        - {type: line, from: [260, 140], to: [260, 440], color: muted, width: 8, cue: "a few decibels"}
        - {type: text, pos: [260, 500], text: "drywall: a few dB", anchor: middle, cue: "a few decibels"}
        - {type: line, from: [500, 140], to: [500, 440], color: red, width: 14, cue: "several more"}
        - {type: text, pos: [500, 500], text: "brick: several dB", anchor: middle, cue: "several more"}
        - {type: line, from: [740, 140], to: [740, 440], color: ink, width: 22, cue: "much more than"}
        - {type: text, pos: [740, 500], text: "thick concrete: much more", anchor: middle, cue: "much more than"}
        - {type: text, pos: [500, 90], text: "steel door: very strong", hand: true, color: red, anchor: middle, cue: "steel door"}
      caption: "2.4 GHz · losses vary with material, thickness and construction"

  - id: S11
    component: equation-steps
    chapter: "Adding it up"
    say: >-
      Now let's build a simplified example. The bedroom is ten meters from the router. The signal
      crosses two drywall walls, which we'll call four decibels each, and one thick concrete wall,
      which we'll call twenty two. That's a tough wall, chosen for this example. Distance first.
      Ten times the distance costs twenty decibels, so minus thirty becomes minus fifty. Then the
      drywall: minus fifty four, minus fifty eight. Then the concrete: minus eighty. That's weak
      enough to make the connection unreliable. In a real house, reflections make the signal jump
      around, but adding the losses gives a useful first estimate.
    params:
      heading: "Our simplified example"
      figure_side: left
      figure:
        view: [1000, 600]
        items:
          - {type: icon, pos: [80, 300], name: router, size: l}
          - {type: icon, pos: [930, 300], name: bed, size: l}
          - {type: arrow, from: [130, 300], to: [870, 300], color: blue}
          - {type: line, from: [300, 160], to: [300, 440], color: muted, width: 8, cue: "two drywall walls"}
          - {type: line, from: [520, 160], to: [520, 440], color: muted, width: 8, cue: "two drywall walls"}
          - {type: line, from: [760, 160], to: [760, 440], color: ink, width: 22, cue: "thick concrete wall"}
          - {type: text, pos: [300, 120], text: "4 dB", anchor: middle, cue: "four decibels each"}
          - {type: text, pos: [520, 120], text: "4 dB", anchor: middle, cue: "four decibels each"}
          - {type: text, pos: [760, 120], text: "22 dB", color: red, anchor: middle, cue: "call twenty two"}
          - {type: dim, from: [80, 500], to: [930, 500], label: "10 m", cue: "ten meters from"}
      lines:
        - {tex: "-30 - 20 = -50\\ \\text{dBm}", note: "distance", cue: "becomes minus fifty"}
        - {tex: "-50 - 4 - 4 = -58\\ \\text{dBm}", note: "drywall ×2", cue: "minus fifty four"}
        - {tex: "-58 - 22 = -80\\ \\text{dBm}", box: true, note: "thick concrete", cue: "Then the concrete"}
        - {text: "simplified estimate; real signals fluctuate", cue: "useful first estimate"}

  - id: S12
    component: graph
    chapter: "The signal staircase"
    say: >-
      Here's the same path on a graph. The dashed curve is ideal open space. It only drops to
      minus fifty at ten meters. The solid line is our example. Every time it hits a wall, it
      steps straight down. Drywall at three meters, drywall at six, and thick concrete at eight.
      By the bedroom, our estimate is minus eighty, around where connections can get unreliable.
    params:
      heading: "Distance plus walls (our example)"
      x_range: [0, 10.5]
      y_range: [-90, -20]
      x_label: "distance from router (m)"
      y_label: "signal (dBm)"
      functions:
        - {expr: "-30-20*log10(x)", from: 1, to: 10, label: "open space", color: muted, dashed: true, cue: "dashed curve"}
        - {expr: "-30-20*log10(x)", from: 1, to: 3, color: red, cue: "solid line is"}
        - {expr: "-34-20*log10(x)", from: 3, to: 6, color: red, cue: "Drywall at three"}
        - {expr: "-38-20*log10(x)", from: 6, to: 8, color: red, cue: "drywall at six"}
        - {expr: "-60-20*log10(x)", from: 8, to: 10, color: red, cue: "concrete at eight"}
      vlines:
        - {x: 3, label: "drywall", cue: "Drywall at three"}
        - {x: 6, label: "drywall", cue: "drywall at six"}
        - {x: 8, label: "concrete", cue: "concrete at eight"}
      points:
        - {x: 10, y: -80, label: "bedroom: −80", cue: "By the bedroom"}
      side:
        - {tex: "\\text{open space at 10 m: } -50", cue: "minus fifty at ten"}

  - id: S13
    component: equation-steps
    chapter: "The fix"
    say: >-
      Now move the router toward the middle of the home, so the signal skips the concrete. In our
      example, the bedroom is now five meters away, through one drywall wall. Five meters costs
      about fourteen decibels, so minus forty four. One wall takes four more: minus forty eight.
      That's thirty two decibels better than before, in our simplified model. Real results vary,
      but fewer obstacles can make a big difference.
    params:
      heading: "Move the router (same model)"
      lines:
        - {tex: "20\\log_{10}(5) \\approx 14\\ \\text{dB}", cue: "fourteen decibels"}
        - {tex: "-30 - 14 = -44\\ \\text{dBm}", cue: "minus forty four"}
        - {tex: "-44 - 4 = -48\\ \\text{dBm}", box: true, cue: "minus forty eight"}
        - {tex: "-80 \\to -48:\\ +32\\ \\text{dB}", note: "estimate", note_cue: "simplified model", cue: "thirty two decibels"}

  - id: S14
    component: bullets
    chapter: "Other ways around walls"
    say: >-
      If you can't move the router, bring the Wi-Fi closer to the room. A second access point
      wired back to the router works especially well. A mesh system can help too, but its units
      need a good link to each other, so don't put one where the signal is already almost gone.
      Keep the router high, in the open, away from big metal objects. And two point four
      gigahertz usually gets through walls better, while five and six gigahertz can be faster up
      close.
    params:
      heading: "Getting around the walls"
      items:
        - {text: "Wired second access point", icon: router, cue: "wired back"}
        - {text: "Mesh: units need a good link", icon: affiliate, cue: "mesh system"}
        - {text: "High, open, away from metal", icon: arrow-up, cue: "router high"}
        - {text: "2.4 GHz reaches · 5/6 GHz faster", icon: antenna, cue: "two point four"}

  - id: S15
    component: table
    chapter: "Same law, ideal conditions"
    say: >-
      The same idea shows up elsewhere. Light from a small lamp and sound from a speaker in an
      open field behave this way under ideal conditions. Double the distance, a quarter of the
      power per square meter, minus six decibels. Ten times the distance, one hundredth, minus
      twenty.
    params:
      heading: "One law, ideal conditions"
      headers: ["Source", "2× distance", "10× distance"]
      rows:
        - ["Wi-Fi (ideal open space)", "¼ · −6 dB", "1/100 · −20 dB"]
        - ["Small lamp", "¼ as bright", "1/100 as bright"]
        - ["Speaker (open field)", "−6 dB", "−20 dB"]
      row_cues: ["same idea", "Light from", "sound from"]

  - id: S16
    component: bullets
    chapter: "Remember this"
    say: >-
      So why does your Wi-Fi die in one room? In ideal open space, power follows the inverse
      square law: double the distance, a quarter of the power, minus six decibels. But inside a
      home, walls can cost as much as distance, or much more. Count the walls, not just the
      meters. Want to test it? A Wi-Fi analyzer app shows your signal in dBm. Check it near the
      router, then in the problem room. It measures strength, not speed, but it shows you where
      the decibels go.
    params:
      heading: "Remember this"
      items:
        - {text: "$1/r^2$ in ideal open space", icon: math-function, cue: "inverse"}
        - {text: "2× distance → ¼ power, −6 dB", icon: arrows-horizontal, cue: "double the distance"}
        - {text: "Count walls, not just meters", icon: wall, cue: "Count the walls"}
        - {text: "Measure dBm, then move the router", icon: device-mobile, cue: "analyzer app"}

  - id: S17
    component: end-card
    say: If you liked this video, please give it a like and subscribe for more everyday engineering. Thanks for watching!
    params: {line: "Thanks for watching"}
