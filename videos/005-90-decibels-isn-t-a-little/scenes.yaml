video:
  id: "005"
  topic: T10
  title: "90 Decibels Isn't a Bit More Than 80. It's 10x the Intensity"
  style: "B hook + A body"
  playlist: math-for-engineers
  phase: math
  series: null
  voice_note: ""
  pronounce: {NIOSH: NYE-osh, OSHA: OH-shuh}

scenes:
  - id: S01
    component: photo-overlay
    chapter: "Ten decibels more"
    say: >-
      This machine runs at about ninety decibels. A quieter one might run at eighty.
      That sounds like a small difference. But it's actually ten times the sound intensity.
      Here's the math, and why it matters for your hearing.
    params:
      src: workshop-machine.jpg
      credit: "Image: AI-generated"
      title: "+10 dB = ?"
      overlays:
        - {type: callout, pos: [62, 55], text: "≈ 90 dB", side: right, cue: "about ninety decibels"}
        - {type: label, pos: [50, 86], text: "80 dB → 90 dB", cue: "small difference"}
        - {type: tex, pos: [50, 30], tex: "\\times 10\\ \\text{sound intensity}", cue: "ten times the"}

  - id: S02
    component: title-card
    say: Let's see what a decibel really measures.
    params: {kicker: "Everyday Engineering · Logarithms", title: "90 Decibels Isn't a Bit More Than 80"}

  - id: S03
    component: big-fact
    chapter: "A huge range of sound"
    say: >-
      Sound carries energy. Engineers measure sound intensity in watts per square meter.
      Under ideal conditions, the faintest sound a healthy human ear can detect has an
      intensity of about one trillionth of a watt per square meter. A jet taking off nearby
      can produce about a hundred watts per square meter. That's a hundred trillion times
      more intense. A normal numerical scale would be difficult to use across such an
      enormous range.
    params:
      label: "Jet takeoff vs the faintest audible sound"
      value: "$10^{14}\\times$"
      sub: "≈ 100 W/m² vs 10⁻¹² W/m²"
      cue: "hundred trillion times"

  - id: S04
    component: equation-steps
    chapter: "The decibel formula"
    say: >-
      So engineers use a logarithmic scale instead. The sound intensity level, L, in decibels,
      equals ten times the logarithm, base ten, of I divided by I zero. Here, I zero is the
      reference intensity: one trillionth of a watt per square meter. A logarithm tells us
      how many factors of ten are involved. Ten times the reference intensity gives ten
      decibels. A hundred times gives twenty decibels. And a trillion times gives one hundred
      and twenty decibels.
    params:
      heading: "Sound intensity level in decibels"
      lines:
        - {tex: "L = 10\\log_{10}\\!\\left(\\dfrac{I}{I_0}\\right)", mark: true, cue: "ten times the logarithm"}
        - {tex: "I_0 = 10^{-12}\\ \\text{W/m}^2", cue: "one trillionth"}
        - {tex: "I = 10\\,I_0 \\;\\Rightarrow\\; L = 10\\ \\text{dB}", cue: "Ten times the reference"}
        - {tex: "I = 100\\,I_0 \\;\\Rightarrow\\; L = 20\\ \\text{dB}", cue: "twenty decibels"}
        - {tex: "I = 10^{12}\\,I_0 \\;\\Rightarrow\\; L = 120\\ \\text{dB}", box: true, cue: "one hundred and twenty"}

  - id: S05
    component: table
    chapter: "Everyday sounds"
    say: >-
      Here's how everyday sounds compare. The reference threshold of human hearing is zero
      decibels. A soft whisper, around thirty decibels, has a thousand times the reference
      intensity. Normal conversation, around sixty, has a million times. A loud motorcycle
      engine, around ninety five, has roughly three billion times. And a jet taking off nearby,
      around a hundred and forty decibels, has a hundred trillion times. These levels are
      approximate and depend on the source and distance. But the mathematical relationship
      is always the same: every thirty decibels represents another factor of a thousand.
    params:
      heading: "Typical sound levels (approx., CDC)"
      headers: ["Sound", "Level", "Intensity vs reference"]
      rows:
        - ["Threshold of hearing", "0 dB", "1×"]
        - ["Soft whisper", "30 dB", "1,000×"]
        - ["Normal conversation", "60 dB", "1,000,000×"]
        - ["Motorcycle engine", "95 dB", "≈ 3 billion×"]
        - ["Jet taking off", "140 dB", "100 trillion×"]
      row_cues: ["zero decibels", "soft whisper", "Normal conversation", "motorcycle engine", "jet taking off"]
      highlight: {row: 4, cue: "factor of a thousand"}

  - id: S06
    component: equation-steps
    chapter: "+10 dB means ×10"
    say: >-
      Now back to our machines. Going from eighty to ninety decibels adds ten. In the formula,
      ten more decibels means the logarithm increases by exactly one. And that means one
      additional factor of ten. So ninety decibels represents ten times the sound intensity
      of eighty. Go up to a hundred decibels, and the intensity is a hundred times that of
      the original eighty decibel sound.
    params:
      heading: "+10 dB means ×10 intensity"
      lines:
        - {tex: "\\Delta L = 10\\log_{10}\\!\\left(\\dfrac{I_2}{I_1}\\right)", cue: "back to our machines"}
        - {tex: "90 - 80 = 10 \\;\\Rightarrow\\; \\log_{10}\\!\\left(\\dfrac{I_2}{I_1}\\right) = 1", cue: "increases by exactly"}
        - {tex: "\\dfrac{I_2}{I_1} = 10", box: true, circle: true, cue: "represents ten times"}
        - {tex: "100\\ \\text{dB vs } 80\\ \\text{dB}:\\ \\times 100", cue: "a hundred times"}

  - id: S07
    component: equation-steps
    chapter: "+3 dB means double"
    say: >-
      Here's a smaller increase with a surprisingly big meaning. What happens when you double
      the intensity? The change in sound level is ten times the logarithm of two. That's
      approximately three decibels. So every three decibel increase nearly doubles the sound
      intensity. Going from eighty five to eighty eight decibels is approximately a doubling.
    params:
      heading: "+3 dB means about double"
      lines:
        - {tex: "\\Delta L = 10\\log_{10} 2", cue: "double the intensity"}
        - {tex: "\\log_{10} 2 \\approx 0.301", cue: "logarithm of two"}
        - {tex: "\\Delta L \\approx 3\\ \\text{dB}", box: true, note: "≈ ×2 intensity", cue: "approximately three decibels"}
        - {tex: "85 \\to 88\\ \\text{dB}:\\ \\approx \\times 2", cue: "approximately a doubling"}

  - id: S08
    component: diagram
    chapter: "80 + 80 isn't 160"
    say: >-
      What happens when two independent machines each produce eighty decibels at your
      listening position? You don't add the decibel numbers. You add their sound intensities.
      Two machines produce twice the intensity, giving approximately three decibels more.
      So eighty plus eighty makes about eighty three decibels. Ten identical, independent
      machines, each producing eighty decibels at that position, produce ten times the
      combined intensity of one machine: ninety decibels.
    params:
      heading: "Two independent 80 dB machines"
      view: [1000, 600]
      items:
        - {type: rect, pos: [80, 180], size: [200, 150], fill: blue, label: "80 dB", cue: "two independent machines"}
        - {type: rect, pos: [320, 180], size: [200, 150], fill: blue, label: "80 dB", cue: "listening position"}
        - {type: tex, pos: [780, 170], tex: "80 + 80 \\neq 160", color: red, cue: "decibel numbers"}
        - {type: text, pos: [300, 420], text: "add intensities, not decibels", hand: true, size: l, color: red, anchor: middle, cue: "add their sound"}
        - {type: tex, pos: [780, 290], tex: "2\\times 10^{8}\\,I_0 \\to 83\\ \\text{dB}", cue: "So eighty plus eighty"}
        - {type: tex, pos: [780, 410], tex: "10\\times 10^{8}\\,I_0 \\to 90\\ \\text{dB}", cue: "combined intensity"}

  - id: S09
    component: bullets
    chapter: "Intensity vs loudness"
    say: >-
      But does ninety decibels sound ten times louder than eighty? Not necessarily. Perceived
      loudness is different from physical sound intensity. For many everyday sounds, a ten
      decibel increase is perceived as roughly twice as loud. So the louder machine may sound
      about twice as loud, even though its intensity is ten times greater. That distinction
      becomes especially important when protecting your hearing.
    params:
      heading: "Intensity vs how loud it sounds"
      items:
        - {text: "Perceived loudness ≠ physical intensity", icon: ear, cue: "Perceived loudness"}
        - {text: "+10 dB: often sounds ≈ 2× as loud", icon: volume, cue: "roughly twice as loud"}
        - {text: "+10 dB: ×10 sound intensity", icon: bolt, cue: "ten times greater"}

  - id: S10
    component: table
    chapter: "Workplace noise limits"
    say: >-
      This is why workplace noise guidelines consider both sound level and exposure time.
      NIOSH, the U.S. agency that researches occupational safety and health, recommends an
      eight hour exposure limit of eighty five A-weighted decibels. For every three decibel
      increase, the recommended exposure duration is cut in half. At eighty eight decibels,
      that's four hours. At ninety one, two hours. And at one hundred decibels, just fifteen
      minutes. OSHA's legal limit for general industry is less protective: ninety decibels
      over eight hours, with exposure duration halved for every five decibel increase. These
      limits are based on long term hearing risk considerations, not a guarantee of safety
      for every individual.
    params:
      heading: "Daily noise exposure limits (dBA)"
      headers: ["Time allowed", "NIOSH (3 dB rule)", "OSHA (5 dB rule)"]
      rows:
        - ["8 h", "85 dBA", "90 dBA"]
        - ["4 h", "88 dBA", "95 dBA"]
        - ["2 h", "91 dBA", "100 dBA"]
        - ["1 h", "94 dBA", "105 dBA"]
        - ["15 min", "100 dBA", "115 dBA"]
      row_cues: ["eight hour exposure", "At eighty eight", "At ninety one", "And at one hundred", "fifteen minutes"]
      highlight: {row: 0, col: 2, cue: "OSHA's legal limit"}

  - id: S11
    component: equation-steps
    chapter: "Back to the machine"
    say: >-
      Let's return to the machines from the beginning. Using the NIOSH exchange rate formula,
      the recommended exposure duration in hours equals eight divided by two raised to the
      power of the sound level minus eighty five, divided by three. At eighty decibels, the
      sound is below NIOSH's eighty five decibel reference level for an eight hour workday.
      But at ninety decibels, the recommended exposure duration falls to approximately two
      and a half hours. A difference of just ten decibels means ten times the sound intensity
      and a dramatic reduction in recommended exposure time.
    params:
      heading: "Recommended exposure time (NIOSH)"
      lines:
        - {tex: "T = \\dfrac{8}{2^{(L-85)/3}}\\ \\text{h}", mark: true, cue: "exchange rate formula"}
        - {text: "$L = 80$: below the 85 dBA reference level", cue: "below NIOSH's"}
        - {tex: "L = 90:\\ T \\approx 2.5\\ \\text{h}", box: true, note: "×10 intensity", cue: "two and a half"}

  - id: S12
    component: bullets
    chapter: "Decibels in engineering"
    say: >-
      Decibels aren't just for sound. Engineers use them for wireless signals, amplifier gain,
      and electronic noise. They're useful whenever we need to compare quantities that can vary
      across enormous numerical ranges. A logarithmic scale compresses those differences into
      numbers that are much easier to work with.
    params:
      heading: "Decibels across engineering"
      items:
        - {text: "Wireless signal strength", icon: wifi, cue: "wireless signals"}
        - {text: "Amplifier gain", icon: volume, cue: "amplifier gain"}
        - {text: "Noise in electronic circuits", icon: cpu, cue: "electronic noise"}

  - id: S13
    component: big-fact
    chapter: "Remember this"
    say: >-
      So here's what to remember. Three decibels more means approximately twice the sound
      intensity. Ten decibels more means ten times the intensity. And over the same amount of
      time, ten times the intensity means ten times the sound energy reaches a given area.
      That's why ninety decibels isn't just a little more than eighty. It's a tenfold increase
      in sound intensity.
    params:
      label: "Remember"
      value: "+10 dB = ×10"
      sub: "+3 dB ≈ ×2 intensity"
      cue: "Ten decibels more"

  - id: S14
    component: end-card
    say: If you liked this video, please give it a like and subscribe for more everyday engineering. Thanks for watching!
    params: {line: "Thanks for watching"}
