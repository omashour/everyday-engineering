shorts:
  - title: "The 63-centimeter rule behind comfortable stairs #shorts"
    hook: "Why do these steps feel odd?"
    end: "Full video on the channel"
    description: "Two measurements and one rule of thumb from the 1600s: twice the rise plus the tread depth.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: A1
        component: photo-overlay
        say: >-
          Why do some steps feel odd? Measure two things. The rise is how far up each step
          goes. The tread depth is how far forward. Designers check a rule of thumb: twice
          the rise plus the tread depth, aiming for about sixty three centimeters.
        params:
          src: stairs-garden.jpg
          credit: "Image: AI-generated"
          title: "Rise and tread depth"
          overlays:
            - {type: measure, from: [65, 64], to: [65, 50], label: "rise", cue: "how far up"}
            - {type: measure, from: [30, 68], to: [62, 68], label: "tread depth", cue: "how far forward"}
            - {type: tex, pos: [30, 30], tex: "2R + T \\approx 63\\text{ cm}", cue: "twice the rise"}
      - id: A2
        component: equation-steps
        say: >-
          That two is a trade-off. Add one centimeter of rise, and the tread loses two. A
          comfortable home stair, seventeen and a half up and twenty eight deep, scores sixty
          three. These garden steps, twelve up and forty five deep, score sixty nine. Each
          step reaches farther than an easy stride.
        params:
          size: l
          lines:
            - {tex: "R + 1 \\;\\Rightarrow\\; T - 2", cue: "Add one centimeter"}
            - {tex: "2(17.5) + 28 = 63\\text{ cm}", cue: "seventeen and a half"}
            - {tex: "2(12) + 45 = 69\\text{ cm}", circle: true, note: "reaches farther", note_cue: "reaches farther", cue: "These garden steps"}
      - id: A3
        component: big-fact
        say: >-
          So you may change your pace. The full video works through a whole staircase design.
        params:
          value: "69 cm vs 63 cm"
          label: "garden steps vs. the target"
          cue: "change your pace"
  - title: "One stair 10 mm too tall changes how you step #shorts"
    hook: "One step 10 mm too tall"
    end: "Full video on the channel"
    description: "In a 2020 lab study, a riser just 10 mm higher cut foot clearance by about 9 mm.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: B1
        component: photo-overlay
        say: >-
          Make one stair just ten millimeters taller, and people's feet clear it by about
          nine millimeters less. That's what researchers measured on a test staircase in a
          twenty twenty lab study.
        params:
          src: stairs-home.jpg
          credit: "Image: AI-generated"
          title: "One taller step"
          overlays:
            - {type: label, pos: [22, 30], text: "+10 mm riser", cue: "ten millimeters taller"}
            - {type: label, pos: [22, 45], text: "≈ 9 mm less clearance", cue: "nine millimeters less"}
      - id: B2
        component: big-fact
        say: >-
          People didn't adjust their steps for the taller riser. With less clearance, a toe is
          more likely to catch the edge, and that can increase the risk of a trip.
        params:
          value: "≈ 9 mm"
          label: "less foot clearance going up"
          sub: "Francksen et al., Applied Ergonomics, 2020"
          cue: "With less clearance"
      - id: B3
        component: bullets
        say: >-
          That's why the American residential model code limits the difference between the
          tallest and shortest riser in a flight to three eighths of an inch. That's about
          nine and a half millimeters. The full video shows the math of stair design.
        params:
          items:
            - {text: "US homes (IRC): risers within ⅜ in", icon: ruler-measure, cue: "three eighths"}
            - {text: "≈ 9.5 mm", icon: equal, cue: "nine and a half"}
