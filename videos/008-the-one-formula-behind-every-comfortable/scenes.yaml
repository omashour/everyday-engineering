video:
  id: "008"
  topic: T41
  title: "The 63-Centimeter Rule Behind Comfortable Stairs"
  style: "B hook + B body"
  playlist: math-for-engineers
  phase: math
  series: null
  voice_note: ""
  pronounce: {Blondel: blon-DELL}

scenes:
  - id: S01
    component: photo-overlay
    chapter: "Why some stairs feel different"
    say: >-
      Some stairs you climb without thinking. Others feel awkward, too steep or too
      stretched out. Much of the difference comes down to two measurements, and one rule
      of thumb designers have used for over three hundred years.
    params:
      src: stairs-home.jpg
      credit: "Image: AI-generated"
      title: "Why do some stairs feel different?"
      overlays:
        - {type: measure, from: [59, 62], to: [59, 44], label: "rise", cue: "too steep"}
        - {type: measure, from: [40, 66], to: [56, 66], label: "tread depth", cue: "too stretched out"}
        - {type: label, pos: [22, 30], text: "2 measurements, 1 rule of thumb", cue: "two measurements"}

  - id: S02
    component: title-card
    say: Let's work through that rule, with a tape measure and a little algebra.
    params: {kicker: "Everyday Engineering · Algebra", title: "The 63-Centimeter Rule Behind Comfortable Stairs"}

  - id: S03
    component: photo-overlay
    chapter: "Rise and tread depth"
    say: >-
      Every step has two measurements. The rise is the vertical distance from one step
      surface to the next. The tread depth, on a straight stair, is the horizontal distance
      from the front edge of one step to the front edge of the next. We'll call them R and
      T. On a typical comfortable home stair, the rise is about seventeen and a half
      centimeters, and the tread depth is about twenty eight. That's about seven inches up
      and eleven inches deep.
    params:
      src: stairs-home.jpg
      credit: "Image: AI-generated"
      title: "Rise R and tread depth T"
      overlays:
        - {type: measure, from: [59, 62], to: [59, 44], label: "R ≈ 17.5 cm", cue: "seventeen and a half"}
        - {type: measure, from: [40, 66], to: [56, 66], label: "T ≈ 28 cm", cue: "about twenty eight"}
        - {type: label, pos: [22, 30], text: "≈ 7 in up · 11 in deep", cue: "seven inches up"}

  - id: S04
    component: diagram
    chapter: "One easy step"
    say: >-
      Start on flat ground. When you walk at an easy pace, each step covers some distance,
      from one footprint to the next. That distance varies from person to person, and with
      how fast you walk. But a stair designer needs one number to aim for. In this video,
      we'll use sixty three centimeters, about twenty five inches.
    params:
      heading: "One easy step"
      view: [1000, 600]
      items:
        - {type: icon, pos: [500, 200], name: walk, size: l, cue: "Start on flat"}
        - {type: text, pos: [500, 320], text: "varies by person and speed", hand: true, color: red, anchor: middle, cue: "varies from person"}
        - {type: ground, from: [60, 430], to: [940, 430]}
        - {type: rect, pos: [200, 385], size: [90, 40], fill: navy, cue: "one footprint"}
        - {type: rect, pos: [650, 385], size: [90, 40], fill: navy, cue: "to the next"}
        - {type: dim, from: [245, 490], to: [695, 490], label: "target: 63 cm (25 in)", cue: "sixty three centimeters"}

  - id: S05
    component: equation-steps
    chapter: "Why the rise counts twice"
    say: >-
      Here's the rule of thumb. Twice the rise, plus the tread depth, should land near that
      target. Two R plus T equals about sixty three centimeters. The two is what makes it a
      trade-off. Keep the target fixed, and add one centimeter to the rise. Then the tread
      depth has to shrink by two centimeters. Taller steps come with shallower treads. Lower
      steps come with deeper ones.
    params:
      heading: "The rise–tread trade-off"
      figure:
        view: [1000, 600]
        items:
          - {type: polyline, points: [[80, 520], [280, 520], [280, 400], [480, 400], [480, 280], [680, 280], [680, 160], [900, 160]], color: ink, width: 4}
          - {type: dim, from: [510, 400], to: [510, 280], label: "R", cue: "Twice the rise"}
          - {type: dim, from: [280, 250], to: [480, 250], label: "T", cue: "should land near"}
      lines:
        - {tex: "2R + T \\approx 63\\ \\text{cm}", mark: true, box: true, cue: "Two R plus T"}
        - {tex: "R \\to R + 1", cue: "add one centimeter"}
        - {tex: "T \\to T - 2", circle: true, cue: "shrink by two"}
        - {tex: "2(R+1) + (T-2) = 2R + T", note: "same target", cue: "Taller steps come"}

  - id: S06
    component: big-fact
    chapter: "Blondel's rule"
    say: >-
      This rule is old. In the late sixteen hundreds, the French architect François Blondel
      wrote it down in his course on architecture. His target was two French feet, about
      sixty five centimeters. Today, designers treat it as a starting point, not a law of
      nature. For our examples, we'll use sixty three, because real walking steps vary from
      person to person.
    params:
      value: "2 French feet ≈ 65 cm"
      label: "Blondel's target (late 1600s)"
      sub: "our examples use 63 cm"
      cue: "two French feet"

  - id: S07
    component: equation-steps
    chapter: "Testing a comfortable stair"
    say: >-
      Let's test it on our comfortable stair. The rise is seventeen and a half centimeters,
      so two rises make thirty five. Add the tread depth of twenty eight. Thirty five plus
      twenty eight is sixty three. Right on our target.
    params:
      heading: "Test: a comfortable stair"
      size: l
      lines:
        - {tex: "2R = 2 \\times 17.5 = 35", cue: "two rises make"}
        - {tex: "2R + T = 35 + 28", cue: "Add the tread"}
        - {tex: "= 63\\ \\text{cm}", box: true, note: "on target", note_cue: "Right on our", cue: "eight is sixty three"}

  - id: S08
    component: photo-overlay
    chapter: "Stairs that score differently"
    say: >-
      Now look at these garden steps. Each rise is only twelve centimeters, but each tread
      is forty five deep. Two R plus T comes to sixty nine, well above our target. Each step
      reaches farther forward than an easy stride, so you may find yourself changing your
      pace to match the steps.
    params:
      src: stairs-garden.jpg
      credit: "Image: AI-generated"
      title: "Garden steps: 69 cm"
      overlays:
        - {type: measure, from: [65, 64], to: [65, 50], label: "R = 12 cm", cue: "only twelve centimeters"}
        - {type: measure, from: [30, 68], to: [62, 68], label: "T = 45 cm", cue: "forty five deep"}
        - {type: tex, pos: [22, 30], tex: "2R + T = 69\\ \\text{cm}", cue: "sixty nine"}
        - {type: callout, pos: [78, 30], text: "reaches farther forward", side: right, cue: "reaches farther forward"}

  - id: S09
    component: photo-overlay
    say: >-
      Now the opposite. On this steep, narrow stair, the rise is twenty one centimeters, and
      the tread depth is just fifteen. Two R plus T is fifty seven, below our target. And a
      fifteen centimeter tread leaves much less room to place your foot.
    params:
      src: stairs-steep.jpg
      credit: "Image: AI-generated"
      title: "Steep stair: 57 cm"
      overlays:
        - {type: measure, from: [56, 60], to: [56, 40], label: "R = 21 cm", cue: "twenty one centimeters"}
        - {type: measure, from: [45, 64], to: [53, 64], label: "T = 15 cm", cue: "just fifteen"}
        - {type: tex, pos: [22, 30], tex: "2R + T = 57\\ \\text{cm}", cue: "fifty seven"}
        - {type: callout, pos: [78, 75], text: "less room for your foot", side: right, cue: "much less room"}

  - id: S10
    component: graph
    chapter: "The target line"
    say: >-
      Let's put every possible stair on one graph. Across is the rise, and up is the tread
      depth. For our target of sixty three, every stair sits on this straight line: the
      tread depth equals sixty three minus two times the rise. The slope of minus two is
      the trade-off we just saw. One more centimeter of rise costs two centimeters of tread.
      Our comfortable stair sits right on the line. The garden steps sit above it. The steep
      stair sits below it.
    params:
      heading: "Target line: 2R + T = 63 cm"
      x_range: [5, 25]
      y_range: [0, 60]
      x_label: "rise $R$ (cm)"
      y_label: "tread depth $T$ (cm)"
      functions:
        - {expr: "63-2*x", label: "$T = 63 - 2R$", color: blue, cue: "this straight line"}
      points:
        - {x: 17.5, y: 28, label: "comfortable: 63", cue: "Our comfortable stair"}
        - {x: 12, y: 45, label: "garden: 69", cue: "garden steps sit"}
        - {x: 21, y: 15, label: "steep: 57", cue: "steep stair sits"}
      side:
        - {tex: "\\text{slope} = -2", cue: "slope of minus two"}

  - id: S11
    component: equation-steps
    chapter: "Same score, different pitch"
    say: >-
      But the line hides a second choice: the pitch, the angle of the stair. Two stairs can
      have the same Blondel value and very different steepness. The tangent of the pitch is
      the rise over the tread depth. A rise of fifteen with a tread of thirty three gives
      sixty three, and climbs at about twenty four degrees. A rise of twenty with a tread of
      twenty three also gives sixty three, but climbs at about forty one degrees. Same score,
      very different stair. So the rule alone can't tell you how steep a stair is.
    params:
      heading: "Same score, different pitch"
      lines:
        - {tex: "\\tan\\theta = \\dfrac{R}{T}", mark: true, cue: "tangent of the pitch"}
        - {tex: "R = 15,\\ T = 33:\\ \\ 63\\ \\text{cm},\\ \\theta \\approx 24^\\circ", cue: "fifteen with a tread"}
        - {tex: "R = 20,\\ T = 23:\\ \\ 63\\ \\text{cm},\\ \\theta \\approx 41^\\circ", circle: true, note: "same score!", note_cue: "Same score", cue: "twenty with a tread"}

  - id: S12
    component: table
    chapter: "What building codes say"
    say: >-
      Building codes set limits too. In the United States, the usual limits come from model
      codes. Each state or city adopts them, sometimes with changes. The residential model
      code typically allows a rise of at most seven and three quarter inches, and a tread
      depth of at least ten inches. The general building code, used for most other
      buildings, allows at most seven inches up, and needs at least eleven inches deep. In
      England, the official guidance, Approved Document K, does use the formula directly.
      Twice the rise plus the going, their word for tread depth, should be between five
      hundred fifty and seven hundred millimeters. And a private stair in a home can be no
      steeper than forty two degrees.
    params:
      heading: "What the codes say"
      headers: ["Source", "Max rise", "Min tread depth", "Notes"]
      rows:
        - ["US homes · IRC", "7¾ in", "10 in", "model code, adopted locally"]
        - ["US other buildings · IBC", "7 in", "11 in", "model code, adopted locally"]
        - ["England · Approved Doc K", "see notes", "see notes", "$2R+G$: 550–700 mm; private ≤ 42°"]
      row_cues: ["residential model code", "general building code", "Approved Document K"]
      highlight: {row: 2, col: 3, cue: "forty two degrees"}

  - id: S13
    component: equation-steps
    chapter: "Why every step must match"
    say: >-
      There's one more rule, and the reason behind it has been measured in a lab. In a twenty
      twenty study, researchers built a test staircase and made one riser just ten
      millimeters higher than the rest. Going up, people's feet cleared that step by about
      nine millimeters less. Less clearance can increase the risk of catching a toe and
      tripping. That's why the American residential model code limits the difference between
      the tallest and shortest riser in one flight to three eighths of an inch. That's about
      nine and a half millimeters.
    params:
      heading: "Why every step must match"
      figure:
        view: [1000, 600]
        items:
          - {type: polyline, points: [[60, 500], [220, 500], [220, 420], [380, 420], [380, 325], [540, 325], [540, 245], [700, 245], [700, 165], [900, 165]], color: ink, width: 4}
          - {type: text, pos: [300, 360], text: "+10 mm", hand: true, color: red, size: l, cue: "ten millimeters higher"}
          - {type: text, pos: [500, 570], text: "Francksen et al., Applied Ergonomics, 2020", size: s, anchor: middle, cue: "twenty twenty study"}
      lines:
        - {text: "one riser **+10 mm**", cue: "ten millimeters higher"}
        - {text: "foot clearance **≈ 9 mm less**", circle: true, cue: "nine millimeters less"}
        - {text: "→ higher trip risk", cue: "catching a toe"}
        - {text: "IRC: risers within **⅜ in ≈ 9.5 mm**", box: true, cue: "three eighths of an inch"}

  - id: S14
    component: equation-steps
    chapter: "Designing a staircase"
    say: >-
      Now let's design a straight staircase. The height from floor to floor is two hundred
      seventy centimeters. We'd like a rise near seventeen and a half. Two seventy divided by
      seventeen and a half is about fifteen point four. We can't build part of a step, so we
      round to fifteen risers. Now every rise is two seventy over fifteen: exactly eighteen
      centimeters.
    params:
      heading: "Design: how many steps?"
      figure_side: left
      figure:
        view: [1000, 600]
        items:
          - {type: polyline, points: [[60, 520], [180, 520], [180, 440], [300, 440], [300, 360], [420, 360], [420, 280], [540, 280], [540, 200], [660, 200], [660, 120], [860, 120]], color: ink, width: 4}
          - {type: dim, from: [920, 520], to: [920, 120], label: "270 cm", cue: "floor to floor"}
      lines:
        - {tex: "\\dfrac{270}{17.5} \\approx 15.4", cue: "fifteen point four"}
        - {text: "round to **15 risers**", cue: "round to fifteen"}
        - {tex: "R = \\dfrac{270}{15} = 18\\ \\text{cm}", box: true, cue: "exactly eighteen centimeters"}

  - id: S15
    component: equation-steps
    say: >-
      The rule of thumb gives the tread depth. Two times eighteen is thirty six. Sixty three
      minus thirty six leaves twenty seven centimeters. Fifteen risers need only fourteen
      treads, because the last step is the upper floor itself. Fourteen times twenty seven is
      three hundred seventy eight centimeters. So the flight itself covers a horizontal run of
      about three point eight meters, at a pitch of about thirty four degrees. Now check two
      residential model code dimensions. Eighteen centimeters is seven point one inches, under
      seven and three quarters. Twenty seven centimeters is ten point six inches, more than
      ten. Both pass. A complete design still has to account for landings, headroom and
      handrails.
    params:
      heading: "Tread depth, run and code check"
      lines:
        - {tex: "T = 63 - 2(18) = 27\\ \\text{cm}", box: true, cue: "leaves twenty seven"}
        - {tex: "\\text{run} = 14 \\times 27 = 378\\ \\text{cm}", note: "flight only", note_cue: "flight itself covers", cue: "Fourteen times twenty"}
        - {tex: "\\theta = \\tan^{-1}\\!\\left(\\tfrac{18}{27}\\right) \\approx 34^\\circ", cue: "pitch of about"}
        - {text: "IRC: 7.1 in ≤ 7¾ ✓ · 10.6 in ≥ 10 ✓", cue: "Now check two"}
        - {text: "still needed: landings, headroom, handrails", cue: "complete design still"}

  - id: S16
    component: bullets
    chapter: "Remember this"
    say: >-
      So why do some stairs feel easy, while others feel awkward? Two measurements tell much
      of the story. Twice the rise plus the tread depth gives a quick check, and our target
      was sixty three centimeters. Every extra centimeter of rise costs two centimeters of
      tread. The same score can still mean a gentle stair or a steep one, so check the pitch
      too. And keep every step the same. Next time a staircase feels strange, take out a tape
      measure and see what the numbers say.
    params:
      heading: "Remember this"
      items:
        - {text: "$2R + T \\approx 63$ cm (our target)", icon: ruler-measure, cue: "Twice the rise"}
        - {text: "+1 cm rise → −2 cm tread", icon: arrows-exchange, cue: "Every extra centimeter"}
        - {text: "Check the pitch too", icon: angle, cue: "check the pitch"}
        - {text: "Keep every step the same", icon: equal, cue: "keep every step"}

  - id: S17
    component: end-card
    say: If you enjoyed this one, please give it a like and subscribe for more everyday engineering. Thanks for watching!
    params: {line: "Thanks for watching"}
