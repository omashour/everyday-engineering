shorts:
  - title: "Where does height = diameter come from? #shorts"
    hook: "Where does h = 2r come from?"
    end: "Full video on the channel"
    description: "In the textbook model, one derivative shows why the least-metal can is as wide as it is tall.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: A1
        component: diagram
        say: >-
          The textbook's best can is exactly as wide as it is tall. That's for a closed cylinder
          with the same metal everywhere and a fixed volume. One derivative shows why. Unroll it:
          two circles, each pi r squared, and a rectangle two pi r by h.
        params:
          view: [1000, 600]
          items:
            - {type: circle, pos: [200, 180], r: 100, color: blue, label: "$\\pi r^2$", cue: "two circles"}
            - {type: circle, pos: [200, 430], r: 100, color: blue, label: "$\\pi r^2$", cue: "two circles"}
            - {type: rect, pos: [400, 150], size: [500, 320], label: "$2\\pi r \\times h$", cue: "a rectangle"}
      - id: A2
        component: equation-steps
        say: >-
          Fix the volume, and the area becomes two pi r squared plus two V over r. Set the
          derivative to zero: V equals two pi r cubed. Since V is pi r squared h, h equals two r.
        params:
          size: l
          lines:
            - {tex: "A = 2\\pi r^2 + \\dfrac{2V}{r}", cue: "the area becomes"}
            - {tex: "V = 2\\pi r^3", cue: "derivative to zero"}
            - {tex: "h = 2r", box: true, cue: "h equals two r"}
      - id: A3
        component: big-fact
        say: >-
          Height equals diameter: about seven point seven centimeters each way for a soda can's
          volume. The full video shows what changes for a real can.
        params:
          value: "7.7 × 7.7 cm"
          label: "textbook can, 355 mL"
          cue: "seven point seven"
  - title: "Heavier ends make the best can taller #shorts"
    hook: "Heavier ends, taller can"
    end: "Full video on the channel"
    description: "Change one assumption in the textbook can model and the optimum shape changes.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: B1
        component: equation-steps
        say: >-
          What if each end uses more metal per square centimeter? Say two point four times the
          side. The same derivative now gives height over diameter equals two point four.
        params:
          size: l
          lines:
            - {tex: "W = k \\cdot 2\\pi r^2 + 2\\pi r h", cue: "more metal per"}
            - {tex: "k = 2.4", cue: "two point four times"}
            - {tex: "h/D = k = 2.4", box: true, cue: "height over diameter"}
      - id: B2
        component: diagram
        say: >-
          With the same metal everywhere, the best can is about seven point seven centimeters each
          way. With heavier ends, it's about five point seven wide and thirteen point eight tall.
          Both hold the same volume.
        params:
          view: [1000, 600]
          items:
            - {type: rect, pos: [150, 330], size: [230, 230], fill: blue, cue: "same metal everywhere"}
            - {type: text, pos: [265, 290], text: "7.7 × 7.7 cm", anchor: middle, cue: "seven point seven"}
            - {type: rect, pos: [600, 147], size: [172, 413], fill: red, cue: "heavier ends"}
            - {type: text, pos: [686, 110], text: "5.7 × 13.8 cm", anchor: middle, cue: "five point seven"}
            - {type: ground, from: [80, 560], to: [920, 560]}
          caption: "both hold 355 mL"
      - id: B3
        component: photo-overlay
        say: >-
          A real can has a narrow neck and a domed base, so neither model is the whole story. The
          full video shows how the assumptions change the answer.
        params:
          src: can-neck-base.jpg
          credit: "Image: AI-generated"
          title: "Real can: neck and dome"
          overlays:
            - {type: callout, pos: [30, 30], text: "narrow neck", side: left, cue: "narrow neck"}
            - {type: callout, pos: [75, 55], text: "domed base", side: right, cue: "domed base"}
