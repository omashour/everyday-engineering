shorts:
  - title: "Calculus says the perfect can is as wide as it is tall #shorts"
    hook: "The least-metal can is squat"
    end: "Full video on the channel"
    description: "One derivative finds the soda can that uses the least metal.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: A1
        component: photo-overlay
        say: >-
          Calculus says the soda can that uses the least metal is exactly as wide as it is tall.
          Here's the one step that proves it.
        params:
          src: can-real.jpg
          credit: "Image: AI-generated"
          title: "Least metal: h = d?"
          overlays:
            - {type: label, pos: [22, 30], text: "least metal: height = width", cue: "least metal"}
      - id: A2
        component: equation-steps
        say: >-
          Fix the volume, and the metal becomes two pi r squared plus two V over r. Set its
          derivative to zero, and V equals two pi r cubed. Since V is also pi r squared h, h
          equals two r. Height equals diameter.
        params:
          size: l
          lines:
            - {tex: "A = 2\\pi r^2 + \\dfrac{2V}{r}", cue: "the metal becomes"}
            - {tex: "V = 2\\pi r^3", cue: "derivative to zero"}
            - {tex: "h = 2r", box: true, cue: "h equals two"}
      - id: A3
        component: big-fact
        say: >-
          For a soda can, that's seven point seven centimeters each way. Real cans are much
          taller. The full video shows why that's not a mistake.
        params:
          value: "7.7 × 7.7 cm"
          label: "least-metal 355 mL can"
          cue: "seven point seven"
  - title: "Why a soda can is taller than the 'perfect' can #shorts"
    hook: "The lid is 2.4× thicker"
    end: "Full video on the channel"
    description: "Thicker ends change the calculus of the perfect can.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: B1
        component: photo-overlay
        say: >-
          The lid of a soda can is about two point four times as thick as its wall. That changes
          the perfect shape.
        params:
          src: can-real.jpg
          credit: "Image: AI-generated"
          title: "Thick lid, thin wall"
          overlays:
            - {type: callout, pos: [80, 25], text: "thick lid", side: right, cue: "lid of a soda"}
            - {type: callout, pos: [80, 55], text: "thin wall", side: right, cue: "as its wall"}
      - id: B2
        component: equation-steps
        say: >-
          If the ends cost k times as much metal as the side, the same calculus gives height over
          diameter equals k. With k around two point four, the cheapest can is about five point
          eight centimeters wide and thirteen point six tall.
        params:
          size: l
          lines:
            - {tex: "C = k \\cdot 2\\pi r^2 + 2\\pi r h", cue: "cost k times"}
            - {tex: "h/d = k", box: true, cue: "height over diameter"}
            - {tex: "d \\approx 5.8,\\ h \\approx 13.6\\ \\text{cm}", cue: "five point eight"}
      - id: B3
        component: big-fact
        say: >-
          The real can, six point six wide, sits between the two answers. The full video does the
          math.
        params:
          value: "6.6 cm"
          label: "the real can: in between"
          cue: "six point six"
