video:
  id: "010"
  topic: T14
  title: "Why Isn't a Soda Can as Wide as It Is Tall?"
  style: "B hook + C body"
  playlist: math-for-engineers
  phase: math
  series: null
  voice_note: ""
  pronounce: {}

scenes:
  - id: S01
    component: photo-overlay
    chapter: "The textbook can vs. yours"
    say: >-
      A textbook model says a soda can should be as wide as it is tall. The can in your hand is
      almost twice as tall as it is wide. What changes when we model a real can?
    params:
      src: can-real.jpg
      credit: "Image: AI-generated"
      title: "Textbook can vs. real can"
      overlays:
        - {type: label, pos: [22, 30], text: "textbook: height = width", cue: "textbook model"}
        - {type: measure, from: [42, 90], to: [58, 90], label: "width", cue: "as wide as"}
        - {type: measure, from: [62, 24], to: [62, 84], label: "≈ 2 × width", cue: "almost twice"}

  - id: S02
    component: title-card
    say: Let's find the textbook answer with one derivative, then change the assumptions.
    params: {kicker: "Everyday Engineering · Calculus", title: "Why Isn't a Soda Can as Wide as It Is Tall?"}

  - id: S03
    component: photo-overlay
    chapter: "The real can"
    say: >-
      Here's a standard twelve ounce can. It's filled with about three hundred fifty five
      milliliters, and it's about six point six centimeters wide and twelve point two tall. But
      it isn't a simple cylinder. It has empty space at the top, a narrow neck, and a domed base.
      A plain cylinder this wide, holding exactly three hundred fifty five milliliters, would be
      only about ten point four centimeters tall.
    params:
      src: can-real.jpg
      credit: "Image: AI-generated"
      title: "Real can: 355 mL fill"
      overlays:
        - {type: measure, from: [42, 90], to: [58, 90], label: "6.6 cm", cue: "six point six"}
        - {type: measure, from: [62, 24], to: [62, 84], label: "real can: 12.2 cm", cue: "twelve point two"}
        - {type: callout, pos: [80, 25], text: "neck, headspace, domed base", side: right, cue: "narrow neck"}
        - {type: callout, pos: [80, 60], text: "355 mL cylinder, same width: 10.4 cm", side: right, cue: "ten point four"}

  - id: S04
    component: diagram
    chapter: "The textbook model"
    say: >-
      The textbook model is simpler: a closed cylinder, with the same thickness of metal
      everywhere, holding a fixed volume. Unroll it, and you get two circles, each pi r squared,
      and a rectangle two pi r wide and h tall. So the metal area is two pi r squared, plus two
      pi r h.
    params:
      heading: "Closed cylinder, uniform metal, fixed volume"
      view: [1000, 600]
      items:
        - {type: circle, pos: [180, 200], r: 90, color: blue, label: "$\\pi r^2$", cue: "two circles"}
        - {type: circle, pos: [180, 420], r: 90, color: blue, label: "$\\pi r^2$", cue: "two circles"}
        - {type: rect, pos: [380, 160], size: [540, 300], label: "side", cue: "a rectangle"}
        - {type: dim, from: [380, 500], to: [920, 500], label: "$2\\pi r$", cue: "two pi r wide"}
        - {type: dim, from: [960, 160], to: [960, 460], label: "$h$", cue: "h tall"}
      caption: "$A = 2\\pi r^2 + 2\\pi r h$"

  - id: S05
    component: equation-steps
    chapter: "Fixing the volume"
    say: >-
      The volume is fixed at three hundred fifty five cubic centimeters. Volume is pi r squared
      h, so once you pick r, the height is set: h equals V over pi r squared. Substitute, and the
      area depends on r alone: two pi r squared, plus two V over r.
    params:
      heading: "One variable, not two"
      size: l
      lines:
        - {tex: "V = \\pi r^2 h = 355\\ \\text{cm}^3", cue: "pi r squared h"}
        - {tex: "h = \\dfrac{V}{\\pi r^2}", cue: "the height is set"}
        - {tex: "A = 2\\pi r^2 + \\dfrac{2V}{r}", box: true, cue: "depends on r alone"}

  - id: S06
    component: graph
    chapter: "The lowest point"
    say: >-
      Now graph that area against the can's width, the diameter, which is two r. A very narrow
      can needs a lot of side wall. A very wide can needs huge ends. So the area rises on both
      sides, and in between there's a lowest point, about two hundred seventy eight square
      centimeters.
    params:
      heading: "Area vs. diameter (355 mL, uniform metal)"
      x_range: [5, 10]
      y_range: [260, 340]
      x_label: "diameter $D$ (cm)"
      y_label: "metal area (cm²)"
      functions:
        - {expr: "3.14159*x^2/2+1420/x", label: "$A(D)$", color: blue, cue: "Now graph that"}
      tracer: {expr: "3.14159*x^2/2+1420/x", from: 5, to: 10, cue: "very narrow", duration: 5}
      points:
        - {x: 7.674, y: 277.55, label: "min ≈ 278 cm²", cue: "lowest point"}
      side:
        - {tex: "D = 2r", cue: "which is two r"}

  - id: S07
    component: equation-steps
    chapter: "The derivative"
    say: >-
      The derivative finds that point exactly. The derivative is the slope of the curve, and at
      the bottom of this valley, the slope is zero. The derivative of the area is four pi r minus
      two V over r squared. Set it to zero, and V equals two pi r cubed.
    params:
      heading: "Slope = 0 at the bottom"
      size: l
      lines:
        - {tex: "\\dfrac{dA}{dr} = 4\\pi r - \\dfrac{2V}{r^2}", cue: "four pi r"}
        - {tex: "4\\pi r - \\dfrac{2V}{r^2} = 0", note: "slope = 0", cue: "Set it to zero"}
        - {tex: "V = 2\\pi r^3", box: true, cue: "two pi r cubed"}

  - id: S08
    component: equation-steps
    chapter: "Height equals diameter"
    say: >-
      But V is also pi r squared h. So pi r squared h equals two pi r cubed, and h equals two r.
      Height equals diameter. For three hundred fifty five milliliters, that's about seven point
      seven centimeters each way.
    params:
      heading: "The textbook answer"
      size: l
      lines:
        - {tex: "\\pi r^2 h = 2\\pi r^3", cue: "is also pi"}
        - {tex: "h = 2r = D", mark: true, box: true, note: "height = diameter", cue: "h equals two r"}
        - {tex: "D = h \\approx 7.7\\ \\text{cm}", cue: "seven point seven"}

  - id: S09
    component: graph
    chapter: "Same width, about 2% more area"
    say: >-
      Now give our simple cylinder the same width as the real can, six point six centimeters. It
      needs only about two percent more surface area than the textbook optimum. Near a minimum,
      the curve is almost flat, so a fairly wide range of widths costs very little extra.
    params:
      heading: "Same width as the real can (model cylinders)"
      x_range: [5, 10]
      y_range: [260, 340]
      x_label: "diameter $D$ (cm)"
      y_label: "metal area (cm²)"
      functions:
        - {expr: "3.14159*x^2/2+1420/x", color: blue, cue: "simple cylinder"}
      points:
        - {x: 6.6, y: 283.58, label: "6.6 cm: +2%", cue: "same width as"}
        - {x: 7.674, y: 277.55, label: "optimum: 7.7", cue: "textbook optimum"}
      side:
        - {tex: "\\approx 2\\%\\ \\text{more area}", cue: "two percent more"}

  - id: S10
    component: equation-steps
    chapter: "A thought experiment: heavier ends"
    say: >-
      Now a thought experiment. What if each end uses more metal per square centimeter than the
      side? Real lids are made of thicker metal than the thin body wall. In our model, the two ends
      are flat, full width disks, and each uses k times as much material per square centimeter as
      the side. We'll try k equals two point four, as an example. The weighted area is k times two
      pi r squared, plus two pi r h. The same derivative gives h equals two k r. Height over
      diameter equals k.
    params:
      heading: "Weighted model: heavier ends"
      lines:
        - {tex: "W = k \\cdot 2\\pi r^2 + 2\\pi r h", cue: "weighted area"}
        - {tex: "k = 2.4", note: "example input", cue: "k equals two point four"}
        - {tex: "h = 2kr", cue: "h equals two k"}
        - {tex: "\\dfrac{h}{D} = k", box: true, cue: "Height over diameter"}

  - id: S11
    component: graph
    chapter: "A taller optimum"
    say: >-
      With k equal to two point four, the best can is about five point seven centimeters wide and
      thirteen point eight tall. Taller and thinner. Here are both models, each measured as
      percent above its own minimum. The real can's diameter falls between the two modeled
      optima, and in both models it's only about two percent above the minimum.
    params:
      heading: "Both models: % above own minimum"
      x_range: [4.5, 10]
      y_range: [0, 25]
      x_label: "diameter $D$ (cm)"
      y_label: "% above model's minimum"
      functions:
        - {expr: "100*((3.14159*x^2/2+1420/x)/277.55-1)", label: "uniform", color: blue, cue: "Here are both"}
        - {expr: "100*((3.7699*x^2+1420/x)/371.59-1)", label: "weighted, k = 2.4", color: red, cue: "own minimum"}
      points:
        - {x: 5.732, y: 0, label: "weighted: 5.7", cue: "five point seven centimeters"}
        - {x: 7.674, y: 0, label: "uniform: 7.7", cue: "own minimum"}
      vlines:
        - {x: 6.6, label: "real can: 6.6", cue: "falls between"}
      side:
        - {tex: "\\text{weighted: } h \\approx 13.8\\ \\text{cm}", cue: "thirteen point eight"}
        - {tex: "\\text{at } 6.6:\\ +2.2\\%,\\ +2.1\\%", cue: "about two percent"}

  - id: S12
    component: photo-overlay
    chapter: "What the models leave out"
    say: >-
      Now look at a real can. The body narrows before it meets the lid, and the base is domed. A
      real design also has to hold internal pressure, and run on filling and seaming equipment.
      Our models don't capture all that. What they show is how the assumptions change the answer.
    params:
      src: can-neck-base.jpg
      credit: "Image: AI-generated"
      title: "What the models leave out"
      overlays:
        - {type: callout, pos: [30, 30], text: "narrow neck", side: left, cue: "body narrows"}
        - {type: callout, pos: [75, 55], text: "domed base", side: right, cue: "base is domed"}
        - {type: label, pos: [50, 88], text: "pressure · filling · seaming", cue: "internal pressure"}

  - id: S13
    component: bullets
    chapter: "Remember this"
    say: >-
      With uniform thickness, the cylinder that uses the least material is as tall as it is wide.
      Make its ends more material intensive, and the optimum gets taller. And because the curve is
      nearly flat around its minimum, a range of widths works with only a small material penalty,
      in the model.
    params:
      heading: "Remember this"
      items:
        - {text: "Uniform metal: $h = D$", icon: equal, cue: "uniform thickness"}
        - {text: "Heavier ends: $h/D = k$", icon: arrow-up, cue: "material intensive"}
        - {text: "Flat minimum: small penalty", icon: scale, cue: "nearly flat"}

  - id: S14
    component: end-card
    say: If you liked this video, please give it a like and subscribe for more everyday engineering. Thanks for watching!
    params: {line: "Thanks for watching"}
