shorts:
  - title: "This bridge closed two days after opening #shorts"
    hook: "Closed 2 days after opening"
    end: "Full video on the channel"
    description: "On opening day, London's Millennium Bridge swayed so much that people grabbed the railings. Two days later, it closed. Here's why the sway grew.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: A1
        component: photo-overlay
        say: >-
          This bridge swayed so much, people grabbed the railings.
          That was opening day for London's Millennium Bridge. Two days later, it closed.
        params:
          src: bridge.jpg
          credit: "Image: AI-generated"
          overlays:
            - {type: label, pos: [50, 40], text: "London, June 2000", cue: "opening day"}
            - {type: callout, pos: [50, 60], text: "closed after 2 days", cue: "Two days later"}
      - id: A2
        component: bullets
        say: >-
          When the deck shifted sideways, people adjusted their steps to keep their balance.
          On average, those adjustments fed energy back into the sway,
          even with people walking out of step.
        params:
          heading: "Why it grew"
          items:
            - {text: "Deck shifts sideways", icon: arrows-horizontal, cue: "deck shifted"}
            - {text: "People adjust their steps", icon: walk, cue: "adjusted their steps"}
            - {text: "Energy feeds the sway", icon: bolt, cue: "fed energy"}
      - id: A3
        component: big-fact
        say: >-
          Engineers installed dampers to take that energy out.
          The full video shows how a little linear algebra explains the way the bridge moves.
        params:
          value: "Dampers"
          label: "take the energy out"
          cue: "installed dampers"
  - title: "What happened when 165 people walked across this span? #shorts"
    hook: "165 walkers. Then it swayed."
    end: "Full video on the channel"
    description: "In a test on London's Millennium Bridge, engineers added walkers one group at a time. At around 165 people, the sideways sway started growing sharply.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: B1
        component: big-fact
        say: >-
          At about one hundred sixty five walkers, this bridge's sway took off.
          After London's Millennium Bridge closed, engineers gradually added walkers to one span,
          and that's where the sideways motion started growing sharply.
        params:
          value: "≈ 165"
          label: "walkers on one span"
          sub: "the tipping point"
          cue: "one hundred sixty five"
      - id: B2
        component: bullets
        say: >-
          A bridge loses some energy every time it sways.
          But walkers adjusting their balance feed energy in.
          Once there were enough walkers, the crowd fed energy into the motion faster than the bridge could lose it.
        params:
          heading: "An energy balance"
          items:
            - {text: "Bridge loses energy each sway", icon: arrow-down, cue: "loses some energy"}
            - {text: "Walkers feed energy in", icon: walk, cue: "feed energy in"}
            - {text: "Enough walkers: energy in wins", icon: bolt, cue: "enough walkers"}
      - id: B3
        component: big-fact
        say: >-
          Engineers added dampers and tested the modified bridge with about two thousand people.
          This time, the sway stayed within acceptable limits. The full video shows the math.
        params:
          value: "≈ 2,000"
          label: "people in tests after the fix"
          sub: "sway within acceptable limits"
          cue: "two thousand people"
