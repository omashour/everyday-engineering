video:
  id: "011"
  topic: T09
  title: "Why Your Coffee Cools Fast, Then Slow"
  style: "B hook + C body"
  playlist: math-for-engineers
  phase: math
  series: null
  voice_note: ""
  pronounce: {}

scenes:
  - id: S01
    component: photo-overlay
    chapter: "Fast, then slow"
    say: >-
      Your coffee doesn't cool at a steady speed. It cools fastest while it's hottest, then slower
      and slower. A simple model can estimate when it reaches the temperature you like, and whether
      to add the milk now or later.
    params:
      src: mug-coffee.jpg
      credit: "Image: AI-generated"
      title: "Why does coffee cool fast, then slow?"
      overlays:
        - {type: callout, pos: [78, 30], text: "fast at first", side: right, cue: "fastest while"}
        - {type: callout, pos: [78, 55], text: "then slower", side: right, cue: "slower and slower"}
        - {type: label, pos: [22, 30], text: "milk: now or later?", cue: "milk now"}

  - id: S02
    component: title-card
    say: Let's work it out with one law of cooling and a little exponential math.
    params: {kicker: "Everyday Engineering · Exponentials", title: "Why Your Coffee Cools Fast, Then Slow"}

  - id: S03
    component: photo-overlay
    chapter: "The gap that matters"
    say: >-
      Here's our setup. Fresh coffee at eighty five degrees Celsius, in a room that stays at twenty
      degrees. What matters isn't the temperature itself. It's the gap between the coffee and the
      room. Right now, that gap is sixty five degrees.
    params:
      src: mug-coffee.jpg
      credit: "Image: AI-generated"
      title: "Our example"
      overlays:
        - {type: label, pos: [22, 30], text: "coffee: 85 °C", cue: "eighty five degrees"}
        - {type: label, pos: [22, 45], text: "room: stays at 20 °C", cue: "stays at twenty"}
        - {type: tex, pos: [22, 62], tex: "\\text{gap} = 85 - 20 = 65\\ °\\text{C}", cue: "sixty five degrees"}

  - id: S04
    component: equation-steps
    chapter: "Newton's law of cooling"
    say: >-
      Newton's law of cooling, in its simplest form, says the coffee's temperature changes at a rate
      proportional to that gap. Twice the gap, twice the cooling speed. The rate of temperature
      change is minus k times the difference between the coffee temperature and room temperature.
      Here, k is an effective cooling constant. It depends on the cup, the lid, the amount of
      liquid, and the surrounding air.
    params:
      heading: "Newton's law of cooling (simple model)"
      lines:
        - {text: "2× gap → 2× cooling speed", cue: "Twice the gap"}
        - {tex: "\\dfrac{dT}{dt} = -k\\,(T - T_{room})", mark: true, cue: "minus k times"}
        - {text: "$k$: cup, lid, amount of liquid, air", cue: "effective cooling constant"}

  - id: S05
    component: equation-steps
    chapter: "An exponential"
    say: >-
      The solution is an exponential: the gap shrinks by the same fraction in every equal stretch of
      time. T equals room temperature, plus the starting gap times e to the minus k t. For this
      example, let's assume the temperature gap halves every ten minutes. That corresponds to a k of
      about point zero seven per minute. So e to the minus k t is exactly one half, to the power t
      over ten.
    params:
      heading: "The gap decays exponentially"
      lines:
        - {tex: "T(t) = T_{room} + (T_0 - T_{room})\\,e^{-kt}", cue: "T equals room"}
        - {tex: "t_{1/2} = 10\\ \\text{min}", note: "assumed", cue: "halves every ten"}
        - {tex: "k = \\dfrac{\\ln 2}{10} \\approx 0.07\\ \\text{min}^{-1}", cue: "point zero seven"}
        - {tex: "e^{-kt} = \\left(\\tfrac{1}{2}\\right)^{t/10}", box: true, cue: "exactly one half"}

  - id: S06
    component: table
    chapter: "Watch the gap"
    say: >-
      Watch the gap. It starts at sixty five degrees. After ten minutes, it's thirty two and a half.
      After twenty, about sixteen. After thirty, about eight. So the coffee goes from eighty five, to
      fifty two and a half, to about thirty six, to about twenty eight. It drops thirty two and a
      half degrees in the first ten minutes, and only about eight in the third ten. Fast, then slow.
    params:
      heading: "The gap halves every 10 minutes"
      headers: ["Time", "Gap to room", "Coffee"]
      rows:
        - ["0 min", "65 °C", "85 °C"]
        - ["10 min", "32.5 °C", "52.5 °C"]
        - ["20 min", "≈ 16 °C", "≈ 36 °C"]
        - ["30 min", "≈ 8 °C", "≈ 28 °C"]
      row_cues: ["starts at sixty five", "After ten minutes", "After twenty", "After thirty"]

  - id: S07
    component: graph
    chapter: "The cooling curve"
    say: >-
      Here's the same story as a curve. The dashed line is the room. Look at the vertical gap
      between the curve and that line. At every ten-minute mark, it's half what it was ten minutes
      earlier. The curve keeps getting closer to the room line, but in the model, it never quite
      reaches it.
    params:
      heading: "Coffee temperature (model)"
      x_range: [0, 60]
      y_range: [0, 90]
      x_label: "time (min)"
      y_label: "temperature (°C)"
      functions:
        - {expr: "20+65*exp(-0.0693*x)", label: "$T(t)$", color: red, cue: "as a curve"}
        - {expr: "20+0*x", label: "room: 20 °C", color: muted, dashed: true, cue: "dashed line"}
      points:
        - {x: 10, y: 52.5, label: "gap 32.5", cue: "vertical gap"}
        - {x: 20, y: 36.25, label: "gap ≈ 16", cue: "half what it was"}
        - {x: 30, y: 28.125, label: "gap ≈ 8", cue: "ten minutes earlier"}
      tracer: {expr: "20+65*exp(-0.0693*x)", from: 0, to: 60, cue: "keeps getting closer", duration: 5}

  - id: S08
    component: equation-steps
    chapter: "Why it slows down"
    say: >-
      That's why the curve flattens. The cooling speed at any moment is k times the gap. At the very
      start, the gap is sixty five, so the coffee is cooling at about four and a half degrees per
      minute. At the ten-minute mark, the gap is half as big, and so is the speed: about two point
      three degrees per minute. Smaller gap, gentler slope.
    params:
      heading: "Cooling speed = k × gap"
      lines:
        - {tex: "\\text{speed} = k \\times \\text{gap}", mark: true, cue: "k times the gap"}
        - {tex: "t = 0:\\ \\ k \\times 65 \\approx 4.5\\ °\\text{C/min}", cue: "four and a half"}
        - {tex: "t = 10:\\ \\ k \\times 32.5 \\approx 2.3\\ °\\text{C/min}", note: "half the gap", note_cue: "half as big", cue: "two point three"}

  - id: S09
    component: equation-steps
    chapter: "Reaching your temperature"
    say: >-
      So when does it reach a temperature you like? Say you want your coffee to cool to sixty
      degrees Celsius. That's a gap of forty. So we need sixty five times one half, to the power t
      over ten, to equal forty. Take logs, and t equals ten times log base two of sixty five over
      forty. About seven minutes, for this mug and these conditions.
    params:
      heading: "Example target: 60 °C"
      size: l
      lines:
        - {tex: "20 + 65\\left(\\tfrac{1}{2}\\right)^{t/10} = 60", cue: "cool to sixty"}
        - {tex: "\\left(\\tfrac{1}{2}\\right)^{t/10} = \\tfrac{40}{65}", cue: "gap of forty"}
        - {tex: "t = 10\\log_2\\!\\left(\\tfrac{65}{40}\\right) \\approx 7\\ \\text{min}", box: true, cue: "About seven minutes"}

  - id: S10
    component: photo-overlay
    chapter: "The milk puzzle"
    say: >-
      Now the milk puzzle. You'll drink in ten minutes. Do you pour in cold milk now, or just before
      you drink? To compare fairly, we'll use the same coffee and the same milk both times. The milk
      stays at five degrees until it's poured, and it makes up one fifth of the final drink. We'll
      assume instant mixing, with the mixed temperature as a simple weighted average. And we'll
      assume both cups follow the same ten-minute cooling half-life.
    params:
      src: mug-milk.jpg
      credit: "Image: AI-generated"
      title: "Milk now, or in 10 minutes?"
      overlays:
        - {type: label, pos: [22, 30], text: "milk: 5 °C until poured", cue: "stays at five"}
        - {type: label, pos: [22, 45], text: "milk = 1/5 of the drink", cue: "one fifth"}
        - {type: label, pos: [22, 60], text: "instant mixing, weighted average", cue: "instant mixing"}
        - {type: label, pos: [22, 75], text: "same 10-min half-life", cue: "same ten-minute"}

  - id: S11
    component: equation-steps
    chapter: "Milk now"
    say: >-
      First, milk now. Point eight times eighty five, plus point two times five, gives sixty nine
      degrees. That's a gap of forty nine. After ten minutes, the gap halves to twenty four and a
      half. So at the ten-minute mark, this cup is at forty four and a half degrees.
    params:
      heading: "Milk now"
      lines:
        - {tex: "0.8(85) + 0.2(5) = 69\\ °\\text{C}", cue: "gives sixty nine"}
        - {tex: "\\text{gap: } 49 \\to 24.5", cue: "halves to twenty four"}
        - {tex: "T(10) = 20 + 24.5 = 44.5\\ °\\text{C}", box: true, cue: "forty four and a half"}

  - id: S12
    component: equation-steps
    chapter: "Milk later"
    say: >-
      Now milk later. The black coffee cools first. Its gap halves from sixty five to thirty two and
      a half, so at ten minutes it's at fifty two and a half. Then the cold milk goes in. Point eight
      times fifty two and a half, plus point two times five, gives forty three degrees. Compared at
      the same moment, right after the second cup gets its milk, the early-milk cup is one and a
      half degrees warmer.
    params:
      heading: "Milk later"
      lines:
        - {tex: "T(10) = 20 + 32.5 = 52.5\\ °\\text{C}", cue: "so at ten minutes"}
        - {tex: "0.8(52.5) + 0.2(5) = 43.0\\ °\\text{C}", box: true, cue: "gives forty three"}
        - {text: "at 10 min: **44.5 °C** vs **43.0 °C**", circle: true, cue: "one and a half degrees"}

  - id: S13
    component: graph
    chapter: "Why early milk stays warmer"
    say: >-
      Here's the picture. The blue cup drops at minute zero, when the milk goes in. The red cup drops
      at minute ten. Early milk reduces the temperature gap right away, so in this model, that cup's
      temperature falls more slowly during the wait. In this example, the model predicts a difference
      of one and a half degrees. In practice, adding milk changes the amount and makeup of the
      liquid, so the two cups can cool at different rates. And with the shared half-life, if the milk
      started at room temperature, both cups would end at forty six degrees. Timing wouldn't matter.
    params:
      heading: "Milk now vs. later (same half-life assumed)"
      x_range: [0, 12]
      y_range: [30, 90]
      x_label: "time (min)"
      y_label: "temperature (°C)"
      functions:
        - {expr: "20+49*exp(-0.0693*x)", from: 0, to: 10, label: "milk now", color: blue, cue: "blue cup drops"}
        - {expr: "20+65*exp(-0.0693*x)", from: 0, to: 10, label: "black, milk later", color: red, dashed: true, cue: "red cup drops"}
      points:
        - {x: 0, y: 69, cue: "minute zero"}
        - {x: 10, y: 52.5, cue: "minute ten"}
        - {x: 10, y: 43, cue: "minute ten"}
        - {x: 10, y: 44.5, cue: "falls more slowly"}
      side:
        - {tex: "\\text{now: } 85 \\to 69 \\to 44.5", cue: "blue cup drops"}
        - {tex: "\\text{later: } 85 \\to 52.5 \\to 43.0", cue: "red cup drops"}
        - {tex: "\\text{milk at } 20°\\text{C: both } 46", cue: "forty six degrees"}

  - id: S14
    component: table
    chapter: "The same simple model"
    say: >-
      The same simple model shows up in engineering. A computer chip cooling after it shuts down
      behaves roughly this way, over a useful stretch of time. And a capacitor discharging through a
      fixed resistor follows it almost exactly. Wherever the rate of change is proportional to the
      remaining gap, with a constant of proportionality, you get the same exponential.
    params:
      heading: "Same simple model"
      headers: ["System", "Gap that decays", "Fits the model"]
      rows:
        - ["Coffee in a mug", "coffee − room temperature", "approximately"]
        - ["Chip after shutdown", "chip − air temperature", "roughly, over a stretch"]
        - ["Capacitor + fixed resistor", "voltage", "almost exactly"]
      row_cues: ["same simple model", "computer chip", "capacitor discharging"]

  - id: S15
    component: bullets
    chapter: "Remember this"
    say: >-
      Real coffee follows this model only approximately. Evaporation can add to the cooling of an
      open mug, and a lid generally slows cooling, partly by limiting evaporation. But in this model,
      each ten-minute stretch cuts the remaining temperature gap in half: fast at first, then slow.
      And in our example, adding the cold milk first kept the coffee a little warmer at the
      ten-minute mark.
    params:
      heading: "Remember this"
      items:
        - {text: "A model: real cups vary", icon: alert-triangle, cue: "only approximately"}
        - {text: "Lids slow cooling (less evaporation)", icon: cup, cue: "lid generally"}
        - {text: "Each 10 min: gap ÷ 2", icon: chart-line, cue: "cuts the remaining"}
        - {text: "Cold milk first: a little warmer", icon: coffee, cue: "cold milk first"}

  - id: S16
    component: end-card
    say: If you liked this video, please give it a like and subscribe for more everyday engineering. Thanks for watching!
    params: {line: "Thanks for watching"}
