shorts:
  - title: "Why your coffee cools fast, then slow #shorts"
    hook: "Coffee cools fast, then slow"
    end: "Full video on the channel"
    description: "In a simple model, the gap between your coffee and the room halves at a steady interval.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: A1
        component: photo-overlay
        say: >-
          Your coffee doesn't cool at a steady speed. In a simple model, its cooling speed depends on
          the gap to room temperature.
        params:
          src: mug-coffee.jpg
          credit: "Image: AI-generated"
          title: "Speed depends on the gap"
          overlays:
            - {type: label, pos: [22, 30], text: "gap to the room", cue: "gap to room"}
      - id: A2
        component: table
        say: >-
          Start at eighty five degrees Celsius in a twenty degree room: a gap of sixty five. Assume,
          for this example, that the gap halves every ten minutes. Then the coffee is at fifty two and
          a half after ten minutes, about thirty six after twenty, and about twenty eight after thirty.
        params:
          headers: ["Time", "Coffee"]
          rows:
            - ["0 min", "85 °C"]
            - ["10 min", "52.5 °C"]
            - ["20 min", "≈ 36 °C"]
            - ["30 min", "≈ 28 °C"]
          row_cues: ["Start at eighty five", "fifty two and a half", "thirty six", "twenty eight"]
      - id: A3
        component: big-fact
        say: >-
          The gap halves every ten minutes: thirty two and a half degrees lost in the first ten, only
          about eight in the third. The full video shows the math.
        params:
          value: "32.5 °C → 8 °C"
          label: "drop per 10 minutes, first vs. third"
          cue: "thirty two and a half"
  - title: "Milk now or later? Newton's law has an answer #shorts"
    hook: "Milk now or later?"
    end: "Full video on the channel"
    description: "With the same cooling half-life for both cups, cold milk added now leaves coffee slightly warmer in ten minutes.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: B1
        component: photo-overlay
        say: >-
          Want warmer coffee in ten minutes? Add the cold milk now, not later.
        params:
          src: mug-milk.jpg
          credit: "Image: AI-generated"
          title: "Milk now or later?"
          overlays:
            - {type: callout, pos: [78, 45], text: "cold milk: now", side: right, cue: "cold milk now"}
      - id: B2
        component: bullets
        say: >-
          If both cups have the same cooling half-life, adding cold milk now shrinks the gap to the
          room right away, so the coffee's temperature falls more slowly during the wait. Add it
          later, and the black coffee cools faster, then the cold milk drops it further.
        params:
          items:
            - {text: "Same half-life for both cups", icon: equal, cue: "same cooling half-life"}
            - {text: "Milk now: smaller gap, slower fall", icon: arrow-down, cue: "shrinks the gap"}
            - {text: "Milk later: faster fall, then a drop", icon: alert-triangle, cue: "Add it later"}
      - id: B3
        component: big-fact
        say: >-
          In our example, it's forty four and a half degrees Celsius versus forty three. That's what the
          model predicts. The full video does the math.
        params:
          value: "44.5 °C vs 43 °C"
          label: "milk now vs. later, at 10 minutes"
          cue: "forty four and a half"
