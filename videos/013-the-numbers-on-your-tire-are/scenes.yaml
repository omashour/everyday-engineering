video:
  id: "009"
  topic: T42
  title: "The Numbers on Your Tire Are a Math Problem"
  style: "B hook + B body (A whiteboard math scenes)"
  playlist: math-for-engineers
  phase: math
  series: null
  voice_note: "Say tire codes as 'two twenty five, forty five, R seventeen', with a short pause at each comma."
  pronounce: {}

scenes:
  - id: S01
    component: photo-overlay
    chapter: "Sixty on the dial, sixty four on the road"
    say: >-
      Your speedometer says sixty. In this example, you're actually doing about
      sixty four. The difference starts with one digit on the tire. Many passenger
      car tires carry a code like this, and it lets you estimate the tire's size.
    params:
      src: tire-wheel.jpg
      credit: "Image: AI-generated"
      focus: [50, 54]
      overlays:
        - {type: callout, pos: [85, 45], text: "60 mph shown → ≈ 64 actual", side: right, cue: "about sixty four"}
        - {type: label, pos: [30, 10], text: "225/==45== R17", cue: "The difference starts"}
        - {type: arrow, from: [42, 10], to: [58, 10], cue: "one digit on"}
        - {type: label, pos: [70, 10], text: "225/==55== R17", cue: "one digit on"}

  - id: S02
    component: title-card
    say: Let's work it out with percentages and a circle.
    params:
      kicker: "Everyday Engineering · Geometry"
      title: "The Numbers on Your Tire Are a Math Problem"

  - id: S03
    component: photo-overlay
    chapter: "Reading the code"
    say: >-
      Here's what each part means. Two twenty five is the nominal section width,
      the tire's width in millimeters. Forty five is the aspect ratio. We'll come
      back to that one. R means radial, the way the layers inside the tire are
      built. And seventeen is the rim diameter, in inches. Yes, one code mixes
      millimeters and inches. Numbers like ninety one V that often follow are the
      load index and the speed rating. For size, we only need the first three.
    params:
      src: tire-sidewall.jpg
      credit: "Image: AI-generated"
      title: "225/45 R17"
      overlays:
        - {type: callout, pos: [20, 30], text: "225 = width (mm)", side: left, cue: "nominal section width"}
        - {type: callout, pos: [20, 72], text: "45 = aspect ratio", side: left, cue: "aspect ratio"}
        - {type: callout, pos: [80, 30], text: "R = radial", side: right, cue: "R means radial"}
        - {type: callout, pos: [80, 72], text: "17 = rim (inches)", side: right, cue: "rim diameter"}

  - id: S04
    component: diagram
    chapter: "The 45 is a percentage"
    say: >-
      Forty five does not mean forty five millimeters. It's a percentage. The
      sidewall height, from the rim to the tread, is forty five percent of the
      tire's width. So at the same width, a lower number means a shorter
      sidewall. That's what people call a low profile tire.
    params:
      heading: "45 is a percent, not mm"
      view: [1000, 600]
      items:
        - {type: rect, pos: [320, 150], size: [360, 160], label: "tire", cue: "The sidewall height"}
        - {type: rect, pos: [340, 310], size: [320, 30], fill: muted}
        - {type: dim, from: [320, 110], to: [680, 110], label: "width = 225 mm", cue: "tire's width"}
        - {type: dim, from: [730, 150], to: [730, 310], label: "45% of width", label_side: right, cue: "forty five percent"}
        - {type: text, pos: [500, 420], text: "aspect ratio = height ÷ width", cue: "It's a percentage"}
        - {type: text, pos: [500, 500], text: "same width: lower number = shorter sidewall", hand: true, color: red, cue: "lower number"}

  - id: S05
    component: equation-steps
    say: >-
      So the sidewall height is two twenty five times zero point four five.
      That's one hundred one point two five millimeters, about four inches of
      sidewall height above the rim, and the same again below it.
    params:
      heading: "Sidewall height"
      size: l
      lines:
        - {tex: "h = 225 \\times 0.45", cue: "two twenty five times"}
        - {tex: "h = 101.25\\ \\text{mm}", box: true, note: "≈ 4 in", cue: "one hundred one"}

  - id: S06
    component: equation-steps
    chapter: "The outside diameter"
    say: >-
      Now the rim. Seventeen inches times twenty five point four is four hundred
      thirty one point eight millimeters. Look at the wheel from the side.
      Straight across, you cross the rim once and the sidewall twice. So the
      estimated outside diameter is the rim plus two sidewall heights. Four
      thirty one point eight, plus two times one oh one point two five, gives six
      hundred thirty four point three millimeters.
    params:
      heading: "Rim + two sidewall heights"
      figure_side: left
      figure:
        view: [600, 600]
        items:
          - {type: circle, pos: [260, 300], r: 220, cue: "from the side"}
          - {type: circle, pos: [260, 300], r: 150, fill: grid, label: "rim"}
          - {type: dim, from: [260, 80], to: [260, 150], label: "h", cue: "sidewall twice"}
          - {type: dim, from: [260, 450], to: [260, 520], label: "h", cue: "sidewall twice"}
          - {type: dim, from: [530, 80], to: [530, 520], label: "D", label_side: left, cue: "rim plus two"}
      lines:
        - {tex: "17 \\times 25.4 = 431.8\\ \\text{mm}", cue: "Seventeen inches times"}
        - {tex: "D = \\text{rim} + 2h", mark: true, cue: "rim plus two"}
        - {tex: "D = 431.8 + 2(101.25)", cue: "Four thirty one"}
        - {tex: "D \\approx 634.3\\ \\text{mm}", box: true, cue: "six hundred thirty four"}

  - id: S07
    component: big-fact
    say: >-
      That's twenty four point nine seven inches, just under twenty five. Measure
      an unmounted, unloaded tire with this code and you'll get roughly that.
      It's an estimate, not an exact size.
    params:
      value: "634 mm"
      label: "Estimated outside diameter"
      sub: "≈ 24.97 in (unloaded)"
      cue: "twenty four point"

  - id: S08
    component: equation-steps
    chapter: "Distance per turn"
    say: >-
      Here's why the diameter matters. In the simple model, each turn of the
      wheel moves the car one circumference, pi times the diameter. That's about
      one point nine nine meters per turn, or about five hundred two turns per
      kilometer, and eight hundred eight per mile. A real tire flexes under the
      car's weight, so its actual distance per turn can differ a little from this
      circle estimate.
    params:
      heading: "One turn = one circumference (model)"
      lines:
        - {tex: "C = \\pi D", cue: "pi times the diameter"}
        - {tex: "C = \\pi \\times 0.6343\\ \\text{m} \\approx 1.99\\ \\text{m}", mark: true, cue: "one point nine nine"}
        - {text: "≈ 502 turns/km · ≈ 808 turns/mile", box: true, cue: "five hundred two"}
        - {text: "real tires flex: an estimate", cue: "flexes under"}

  - id: S09
    component: photo-overlay
    chapter: "How your speedometer knows"
    say: >-
      Your speedometer doesn't measure the road. It measures how fast something
      is turning, the wheels or a shaft that turns with them, and multiplies by a
      distance per turn set at the factory. If the calibration stays the same,
      the car keeps using the original distance per turn, even after you change
      the tires.
    params:
      src: speedometer.jpg
      credit: "Image: AI-generated"
      title: "Speed = turns × distance per turn"
      overlays:
        - {type: callout, pos: [18, 40], text: "counts turns", side: left, cue: "how fast something"}
        - {type: callout, pos: [18, 72], text: "distance per turn: factory setting", side: left, cue: "set at the factory"}
        - {type: tex, pos: [82, 55], tex: "v = n \\times C", cue: "multiplies by"}

  - id: S10
    component: diagram
    chapter: "Change one digit"
    say: >-
      Now change one digit. Fit a two twenty five, fifty five, R seventeen
      instead. Same width, same rim. The sidewall height grows to one hundred
      twenty three point seven five millimeters, and the diameter to six hundred
      seventy nine point three. Roll each tire through one full turn. The
      original covers about one point nine nine meters. The new one covers about
      two point one three. That's about fourteen centimeters farther, every turn.
    params:
      heading: "One full turn of each tire"
      view: [1000, 600]
      items:
        - {type: text, pos: [500, 120], text: "225/55 R17: h = 123.75 mm, D = 679.3 mm", size: s, cue: "one hundred twenty three"}
        - {type: dim, from: [80, 260], to: [780, 260], label: "225/45: ≈ 1.99 m", cue: "original covers"}
        - {type: dim, from: [80, 400], to: [830, 400], label: "225/55: ≈ 2.13 m", color: red, cue: "new one covers"}
        - {type: text, pos: [500, 520], text: "about 14 cm farther per turn", hand: true, color: red, cue: "fourteen centimeters farther"}

  - id: S11
    component: equation-steps
    chapter: "What the speedometer shows"
    say: >-
      The new tire is bigger by six seventy nine point three over six thirty
      four point three. That's about one point zero seven one. Assume the
      speedometer was accurate on the original tires and its calibration hasn't
      changed. Then, in this model, actual speed is about seven percent higher
      than indicated. One hundred kilometers an hour on the dial is about one
      hundred seven. Sixty miles an hour is about sixty four.
    params:
      heading: "Assume: accurate before, same calibration"
      lines:
        - {tex: "\\dfrac{679.3}{634.3} \\approx 1.071", mark: true, cue: "six seventy nine"}
        - {text: "actual ≈ 7% higher than indicated", cue: "seven percent higher"}
        - {tex: "100\\ \\text{km/h} \\to \\approx 107\\ \\text{km/h}", cue: "one hundred seven"}
        - {tex: "60\\ \\text{mph} \\to \\approx 64\\ \\text{mph}", box: true, cue: "about sixty four"}

  - id: S12
    component: graph
    chapter: "Indicated vs. actual"
    say: >-
      Here's the whole picture. The navy line is the original tire. The red line
      is the larger tire, seven percent above it at every speed. A smaller tire
      would shift things the other way. So with the larger tire, you could be
      going faster than the dial suggests.
    params:
      heading: "Same calibration, different tires"
      x_range: [0, 130]
      y_range: [0, 140]
      x_label: "Indicated speed (km/h)"
      y_label: "Estimated actual speed (km/h)"
      functions:
        - {expr: "x", color: navy, cue: "original tire"}
        - {expr: "1.071*x", label: "225/55 R17", color: red, cue: "red line"}
        - {expr: "0.929*x", color: blue, dashed: true, cue: "smaller tire"}
      points:
        - {x: 100, y: 107.1, label: "≈ 107", cue: "faster than the dial"}
      side:
        - {tex: "v_{\\text{actual}} \\approx 1.071\\, v_{\\text{shown}}", cue: "at every speed"}

  - id: S13
    component: big-fact
    chapter: "The odometer too"
    say: >-
      The odometer counts turns the same way. Under the same assumptions, when it
      reads ten thousand kilometers, you've traveled about ten thousand seven
      hundred. So mileage-based service reminders would come a little late.
    params:
      value: "≈ 10,700 km"
      count: {from: 10000, to: 10700, prefix: "≈ ", suffix: " km"}
      label: "Odometer reads 10,000 km"
      sub: "estimated distance traveled"
      cue: "ten thousand seven"

  - id: S14
    component: photo-overlay
    chapter: "Bigger wheels, shorter sidewalls"
    say: >-
      So how do people fit larger wheels and keep the outside diameter close to
      the original? They choose a larger rim and a lower aspect ratio. Go from a
      seventeen inch rim to an eighteen, and from forty five to forty. The rim
      adds about two and a half centimeters, and the shorter sidewalls take
      almost all of it back.
    params:
      src: low-profile-wheel.jpg
      credit: "Image: AI-generated"
      title: "Larger rim, lower aspect ratio"
      overlays:
        - {type: callout, pos: [78, 32], text: "18-inch rim", side: right, cue: "seventeen inch rim"}
        - {type: label, pos: [35, 88], text: "225/40 R18", cue: "forty five to forty"}
        - {type: callout, pos: [78, 68], text: "shorter 40% sidewall", side: right, cue: "shorter sidewalls"}

  - id: S15
    component: table
    say: >-
      Here's the geometry. The eighteen inch version is about half a percent
      larger than the original. The nineteen is under one percent. Compare that
      with seven percent from changing one digit. But keeping the diameter close
      is only one part of fitment. Wheel fit, clearance and load capacity matter
      too. Use a size approved by the vehicle manufacturer.
    params:
      heading: "Geometry comparison: same width"
      headers: ["Tire", "Sidewall height", "Diameter", "Change"]
      rows:
        - ["225/45 R17", "101.25 mm", "634.3 mm", "baseline"]
        - ["225/40 R18", "90.00 mm", "637.2 mm", "+0.46%"]
        - ["225/35 R19", "78.75 mm", "640.1 mm", "+0.91%"]
      row_cues: ["Here's the geometry", "eighteen inch version", "nineteen is under"]
      highlight: {row: 0, cue: "approved by the"}

  - id: S16
    component: bullets
    chapter: "Same math, other wheels"
    say: >-
      Anywhere a wheel measures distance, the same math applies. A bike computer
      asks for your wheel circumference before it shows your speed. A surveyor's
      measuring wheel counts turns to measure a path. If the wheel rolls without
      slipping, a one percent error in circumference becomes a one percent error
      in every distance.
    params:
      heading: "Wheels that measure distance"
      items:
        - {text: "Bike computer: enter wheel circumference", icon: bike, cue: "bike computer"}
        - {text: "Measuring wheel: counts turns", icon: ruler-measure, cue: "measuring wheel"}
        - {text: "1% circumference error → 1% distance error", icon: alert-triangle, cue: "without slipping"}

  - id: S17
    component: photo-overlay
    chapter: "Remember this"
    say: >-
      So read a tire like an engineer. Two twenty five is the width. Forty five
      percent of that is the sidewall height. Add two of those to the rim and you
      get about six hundred thirty four millimeters. Change forty five to fifty
      five, and under the same assumptions, sixty on your speedometer is about
      sixty four on the road.
    params:
      src: tire-wheel.jpg
      credit: "Image: AI-generated"
      title: "225/45 R17, solved"
      focus: [50, 54]
      overlays:
        - {type: measure, from: [30, 54], to: [70, 54], label: "≈ 634 mm", cue: "six hundred thirty four"}
        - {type: callout, pos: [15, 30], text: "225/==45== → 225/==55==", side: left, cue: "Change forty five"}
        - {type: callout, pos: [85, 30], text: "60 mph shown ≈ 64 actual", side: right, cue: "sixty four on"}

  - id: S18
    component: end-card
    say: If you liked this, give it a like and subscribe. Thanks for watching!
    params: {line: "Thanks for watching"}
