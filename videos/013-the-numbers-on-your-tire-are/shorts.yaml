shorts:
  - title: "One tire digit can throw off your speedometer #shorts"
    hook: "One digit, wrong speed?"
    end: "Full video on the channel"
    description: "Change 225/45R17 to 225/55R17 and, if the speedometer keeps its old calibration, 60 mph on the dash works out to about 64 mph on the road in this example.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: A1
        component: photo-overlay
        say: >-
          Your speedometer says sixty. Could you actually be doing sixty four?
          Look at the tire code. Change two twenty five, forty five, R seventeen
          to two twenty five, fifty five, R seventeen. Only one digit changes.
        params:
          src: tire-wheel.jpg
          credit: "Image: AI-generated"
          focus: [50, 54]
          overlays:
            - {type: label, pos: [50, 20], text: "60 mph?", cue: "says sixty"}
            - {type: label, pos: [50, 75], text: "225/==45== R17", cue: "Look at the"}
            - {type: label, pos: [50, 90], text: "225/==55== R17", cue: "Only one digit"}
      - id: A2
        component: equation-steps
        say: >-
          That bigger sidewall makes the tire about six hundred seventy nine
          millimeters across, instead of six hundred thirty four. So it covers
          about seven percent more ground every turn.
        params:
          size: l
          lines:
            - {tex: "D_{55} \\approx 679\\ \\text{mm}", cue: "That bigger sidewall"}
            - {tex: "D_{45} \\approx 634\\ \\text{mm}", cue: "instead of"}
            - {tex: "\\dfrac{679}{634} \\approx 1.07", circle: true, cue: "seven percent more"}
      - id: A3
        component: big-fact
        say: >-
          If the speedometer was accurate before and keeps using its old
          calibration, sixty on the dash works out to about sixty four on the road
          in this example. The full video shows the math.
        params:
          value: "≈ 64 mph"
          label: "Dash shows 60 mph"
          sub: "estimated actual speed"
          cue: "about sixty four"
  - title: "What the 45 on your tire actually means #shorts"
    hook: "What the 45 really means"
    end: "Full video on the channel"
    description: "The 45 in 225/45R17 isn't millimeters. It's the sidewall height as a percentage of the tire's width.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: B1
        component: photo-overlay
        say: >-
          The forty five on your tire isn't millimeters. It's a percentage. The
          sidewall height is forty five percent of the tire's nominal width.
        params:
          src: tire-sidewall.jpg
          credit: "Image: AI-generated"
          overlays:
            - {type: label, pos: [50, 40], text: "225/==45== R17", cue: "on your tire"}
            - {type: label, pos: [50, 70], text: "45 = 45% of width", cue: "It's a percentage"}
      - id: B2
        component: equation-steps
        say: >-
          This tire is two hundred twenty five millimeters wide. Forty five
          percent of that is about one hundred one millimeters, or about four
          inches of sidewall height. That's more than twice what forty five
          millimeters would be.
        params:
          size: l
          lines:
            - {tex: "225 \\times 0.45", cue: "Forty five percent"}
            - {tex: "\\approx 101\\ \\text{mm} \\approx 4\\ \\text{in}", box: true, cue: "one hundred one"}
            - {tex: "\\text{not } 45\\ \\text{mm}", circle: true, cue: "more than twice"}
      - id: B3
        component: bullets
        say: >-
          At the same width, a lower percentage gives a shorter sidewall. That's
          how a larger rim can fit inside a tire with nearly the same outside
          diameter. The full video does the math.
        params:
          items:
            - {text: "Same width, lower % → shorter sidewall", icon: arrow-down, cue: "lower percentage"}
            - {text: "Larger rim fits inside", icon: circle-plus, cue: "larger rim"}
            - {text: "Outside diameter nearly the same", icon: equal, cue: "nearly the same"}
