shorts:
  - title: "Your card number checks itself #shorts"
    hook: "Your card number checks itself"
    end: "Full video on the channel"
    description: "Mistype one digit of your card number and a checkout form can spot it without asking your bank. The last digit is a check digit.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: A1
        component: photo-overlay
        say: >-
          A checkout form can spot a one digit typo without asking your bank. The last
          digit is a check digit, calculated from all the others.
        params:
          src: checkout.jpg
          credit: "Image: AI-generated"
          overlays:
            - {type: label, pos: [50, 25], text: "✗ Invalid card number", cue: "can spot a"}
            - {type: label, pos: [50, 75], text: "last digit = check digit", cue: "last digit is"}
      - id: A2
        component: equation-steps
        say: >-
          Here's the check. Double every second digit, starting next to the check
          digit. If you get two digits, add them, so sixteen becomes seven. Then add
          everything up. If the total ends in zero, the number passes the Luhn check.
        params:
          lines:
            - {text: "double every 2nd digit", cue: "Double every second"}
            - {tex: "16 \\to 1 + 6 = 7", cue: "sixteen becomes seven"}
            - {text: "total ends in 0 → passes", box: true, cue: "ends in zero"}
      - id: A3
        component: big-fact
        say: >-
          Replace any one digit in a number that passes, and the new total can't end
          in zero. So every one digit typo like that gets caught. The full video works
          through an example by hand.
        params:
          value: "100%"
          label: "of one-digit substitutions"
          sub: "caught by one extra digit"
          cue: "every one digit"
  - title: "The one digit swap your card number check misses #shorts"
    hook: "Swap two digits? Usually caught"
    end: "Full video on the channel"
    description: "Swap two different neighboring digits in a card number and the Luhn check usually catches it. There's exactly one exception.\n\nFull video: [paste the main video's link]"
    scenes:
      - id: B1
        component: photo-overlay
        say: >-
          Swap two different neighboring digits in a card number, and the Luhn check
          usually catches it. A plain sum wouldn't. Here's the trick.
        params:
          src: checkout.jpg
          credit: "Image: AI-generated"
          overlays:
            - {type: label, pos: [50, 25], text: "…39… → …93…", cue: "Swap two different"}
            - {type: label, pos: [50, 75], text: "usually caught ✗", cue: "usually catches it"}
      - id: B2
        component: equation-steps
        say: >-
          Every second digit gets doubled. So if three and nine swap places,
          three doubled plus nine is fifteen. But nine doubled, folded to nine,
          plus three is only twelve. The total changes, and the check fails.
        params:
          size: l
          lines:
            - {tex: "2 \\times 3 + 9 = 15", cue: "three doubled plus"}
            - {tex: "9 + 3 = 12", note: "18 → 9", cue: "folded to nine"}
            - {text: "total changes → rejected", box: true, cue: "check fails"}
      - id: B3
        component: bullets
        say: >-
          There's one exception for different neighboring digits. Swap zero and nine,
          and the total stays the same, because zero doubled is zero and nine doubled
          folds back to nine. The full video shows the whole trick.
        params:
          items:
            - {text: "Other neighbor swaps: caught", icon: circle-check, cue: "one exception"}
            - {text: "09 ↔ 90: missed", icon: alert-triangle, cue: "Swap zero and"}
