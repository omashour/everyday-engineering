note: Generated by `npm run docs` from styles/styles.yaml and the component code. Do not edit by hand.
styles:
  - id: A
    folder: A-whiteboard
    name: Whiteboard Build
    look: White background, equations built line by line, yellow marker, red circles/arrows/notes, simple diagrams. Closest to Brain Station; cheapest.
    best_for:
      - derivations
      - worked examples
      - algebra
      - trigonometry
      - logarithms
      - probability calculations
      - how to solve any X
    avoid_for:
      - stories
      - things that move over time
    components:
      - diagram
      - equation-steps
      - table
  - id: B
    folder: B-real-world
    name: Real-World Overlay
    look: Photo of the real object with animated measurements, arrows, callouts and math on top. The channel's signature hook.
    best_for:
      - hooks (first 15 s of any video)
      - everyday objects
      - structures
      - roads
      - products
    avoid_for:
      - long derivations
    needs: a photo per scene (own or CC0/CC BY with credit)
    components:
      - photo-overlay
  - id: C
    folder: C-graph-lab
    name: Graph Lab
    look: Animated graphs - curves drawing themselves, shaded areas, moving points, reference lines.
    best_for:
      - calculus
      - growth and decay
      - waves
      - vibration
      - differential equations
      - queueing curves
      - anything that changes over time
    avoid_for:
      - pure symbol manipulation
    components:
      - graph
  - id: D
    folder: D-story
    name: Story / Case Study
    look: Timeline, archive-style photos, quotes, then the math that explains the event.
    best_for:
      - real events
      - disasters
      - famous engineers
      - why the world works this way
      - viral-style videos
    avoid_for:
      - routine exercises
    needs: accurate dates and sources; archive photos with licenses
    components:
      - quote
      - timeline
  - id: E
    folder: E-shorts
    name: Shorts
    look: Vertical 9:16 cut of the long video - hook banner, 2-3 scenes, end card. Built automatically from shorts.yaml.
    best_for:
      - every long video gets 1-2
    components:
      - short-end
  - id: F
    folder: F-problem-solver
    name: Engineering Problem Solver
    look: Textbook layout - problem card (figure, Given, Find, Assume), numbered steps with units, boxed answer, sanity check, optional pause-and-try, practice problem.
    best_for:
      - solved problems in statics
      - mechanics of materials
      - circuits
      - fluids
      - thermodynamics
      - engineering economics
      - industrial engineering (LP
      - queueing
      - inventory
      - reliability
      - quality)
    avoid_for:
      - broad-appeal hooks
    components:
      - answer-box
      - beam
      - pause-try
      - problem-card
shared_components:
  - big-fact
  - bullets
  - end-card
  - image
  - title-card
