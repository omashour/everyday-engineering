# The channel's visual styles. Edit here; `npm run docs` copies this into styles/index.yaml
# and the skill reference. best_for / avoid_for drive the skill's style suggestions.
styles:
  - id: A
    folder: A-whiteboard
    name: Whiteboard Build
    look: White background, equations built line by line, yellow marker, red circles/arrows/notes, simple diagrams. Closest to Brain Station; cheapest.
    best_for: [derivations, worked examples, algebra, trigonometry, logarithms, probability calculations, "how to solve any X"]
    avoid_for: [stories, things that move over time]
  - id: B
    folder: B-real-world
    name: Real-World Overlay
    look: Photo of the real object with animated measurements, arrows, callouts and math on top. The channel's signature hook.
    best_for: [hooks (first 15 s of any video), everyday objects, structures, roads, products]
    avoid_for: [long derivations]
    needs: a photo per scene (own or CC0/CC BY with credit)
  - id: C
    folder: C-graph-lab
    name: Graph Lab
    look: Animated graphs - curves drawing themselves, shaded areas, moving points, reference lines.
    best_for: [calculus, growth and decay, waves, vibration, differential equations, queueing curves, anything that changes over time]
    avoid_for: [pure symbol manipulation]
  - id: D
    folder: D-story
    name: Story / Case Study
    look: Timeline, archive-style photos, quotes, then the math that explains the event.
    best_for: [real events, disasters, famous engineers, "why the world works this way", viral-style videos]
    avoid_for: [routine exercises]
    needs: accurate dates and sources; archive photos with licenses
  - id: E
    folder: E-shorts
    name: Shorts
    look: Vertical 9:16 cut of the long video - hook banner, 2-3 scenes, end card. Built automatically from shorts.yaml.
    best_for: [every long video gets 1-2]
  - id: F
    folder: F-problem-solver
    name: Engineering Problem Solver
    look: Textbook layout - problem card (figure, Given, Find, Assume), numbered steps with units, boxed answer, sanity check, optional pause-and-try, practice problem.
    best_for: [solved problems in statics, mechanics of materials, circuits, fluids, thermodynamics, engineering economics, industrial engineering (LP, queueing, inventory, reliability, quality)]
    avoid_for: [broad-appeal hooks]
