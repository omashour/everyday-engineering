# Narration voice and transcription settings. Read by `npm run tts-pack` and `npm run transcribe`.
gemini:
  model: gemini-3.8-flash-tts
  # Voice not chosen yet. Try a few prebuilt voices in AI Studio with the style below
  # (e.g. Kore, Charon, Puck, Aoede…), then write the winner here and keep it for every video.
  voice: null
  style: >-
    A clear, warm, confident engineering teacher talking to one curious student.
    Energetic and intriguing in the opening hook, then calm and steady for explanations.
    Natural pace (about 150 words per minute), short pauses between sentences and a
    longer pause between paragraphs. Emphasize the surprising number or result in each section.
    Never rush through math.
  # Max words per recording chunk. Lower it if AI Studio cuts long text off.
  chunk_max_words: 280

# Channel-wide pronunciation list; a video can add its own under video.pronounce in scenes.yaml.
pronounce:
  Torricelli: tor-ih-CHEL-ee
  clothoid: KLOTH-oyd
  Euler: OY-ler
  Bernoulli: ber-NOO-lee
  Laplace: la-PLAHSS

transcription:
  model: base.en      # used if Parakeet is not installed; HyperFrames picks Parakeet automatically when present
  chunk_gap_s: 0.35   # silence inserted between joined chunks

# Writing rules for narration (the skill follows these):
rules:
  - Write math as it is spoken - "v squared over two a", "e to the minus lambda t", "one over r squared".
  - Spell out ambiguous numbers and units - "ninety decibels", "four point seven six degrees".
  - Short sentences. One idea per sentence. No "Hi guys" or channel intro.
  - Never put stage directions in the narration; delivery goes in the style instructions.
